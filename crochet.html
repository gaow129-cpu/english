<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>鉤織手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: sidebar on wide screens, bottom tab bar on phones; linen paper ground, rose for "where you are", forest green for actions */
:root{
  --bg:#F2EDE6; --paper:#FBF8F4; --ink:#2C2420; --muted:#7B6F67; --line:#E3DAD0;
  --rose:#AE5E66; --rose-soft:#F2E0DE; --green:#2E5140; --green-soft:#DCE6DE; --on-green:#FBF8F4;
  --shadow:0 1px 2px rgba(60,40,30,.06),0 6px 18px rgba(60,40,30,.06);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1917; --paper:#25221F; --ink:#EEE6DC; --muted:#A99D92; --line:#3A3531;
  --rose:#E19AA0; --rose-soft:#3D2B2C; --green:#93C2A4; --green-soft:#22322A; --on-green:#16201A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1917; --paper:#25221F; --ink:#EEE6DC; --muted:#A99D92; --line:#3A3531;
  --rose:#E19AA0; --rose-soft:#3D2B2C; --green:#93C2A4; --green-soft:#22322A; --on-green:#16201A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.side{border-right:1px solid var(--line);padding:28px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand svg{flex:none}
.brand b{font-family:var(--serif);font-size:20px;letter-spacing:.06em}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;color:var(--muted);text-align:left}
.nav button[aria-current="page"]{background:var(--green-soft);color:var(--green);font-weight:500}
.nav svg{width:20px;height:20px;flex:none}
main{padding-block:32px 48px;padding-inline:clamp(16px,4vw,48px);min-width:0;max-width:960px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-family:var(--serif);font-weight:700;font-size:28px;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-family:var(--serif);font-weight:700;font-size:19px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--green);color:var(--on-green);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--rose);border:1px solid var(--rose)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 14px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.list{display:grid;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.proj{display:grid;grid-template-columns:96px 1fr;overflow:hidden}
.tile{min-height:120px;background-image:radial-gradient(rgba(255,255,255,.22) 1.6px,transparent 2.2px),radial-gradient(rgba(0,0,0,.18) 1.6px,transparent 2.2px);background-size:9px 8px,9px 8px;background-position:0 0,4.5px 4px}
.pbody{padding:14px 16px;display:grid;gap:8px;min-width:0}
.pill{display:inline-block;font-size:11px;letter-spacing:.08em;padding:1px 8px;border-radius:5px;background:var(--green-soft);color:var(--green);font-weight:500;justify-self:start}
.pill.paused{background:var(--rose-soft);color:var(--rose)}
.pill.done{background:var(--line);color:var(--muted)}
.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.stats{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.stat small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.stat b{font-family:var(--serif);font-size:22px;color:var(--rose);font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.back{border:0;background:none;color:var(--muted);padding:0;margin-bottom:12px;font-size:14px}
.counter{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cbox{padding:18px;text-align:center;display:grid;gap:10px}
.cbox .lbl{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.cbox .num{font-family:var(--serif);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.cbox .num small{font-size:18px;color:var(--muted)}
.pm{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.pm button{white-space:nowrap;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 0;font-size:22px}
.pm button.plus{background:var(--green);color:var(--on-green);border-color:var(--green)}
.target{font-size:13px;color:var(--muted)}
.target b{color:var(--rose)}
.stepbox .kind{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--green)}
.stepbox .kind.dec{color:var(--rose)}
.stepbox .kind small{font-size:13px;font-weight:400;margin-left:6px;color:var(--muted)}
.stepbox .num.ok{color:var(--green)}
.strip{margin-top:14px;padding:12px 14px;display:grid;gap:8px;overflow-x:auto}
.srow{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.rlab{font-size:12px;color:var(--muted);width:34px;flex:none}
.seg{font-size:13px;padding:3px 9px;border-radius:7px;border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.seg.dec{color:var(--rose)}
.seg.past{opacity:.4;text-decoration:line-through}
.seg.on{background:var(--green);border-color:var(--green);color:var(--on-green);font-weight:700}
.seg.on.dec{background:var(--rose);border-color:var(--rose)}
.parts{display:grid;gap:6px}
.part{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 12px;text-align:left}
.part b{font-weight:500}
.part span{color:var(--muted);font-size:13px;white-space:nowrap}
.micbtn{white-space:nowrap}
.micbtn .dot{width:9px;height:9px;border-radius:50%;background:var(--on-green);display:inline-block;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.micbtn .dot{animation:none}}
.meter{position:relative;height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin:0 8px}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green)}
.meter b{position:absolute;top:0;bottom:0;width:3px;background:var(--rose);left:30%}
.vmodes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.heard{font-size:13px;color:var(--green);text-align:center;margin-top:-6px}
.heard.err{color:var(--rose)}
.focus{display:flex;flex-direction:column}
.fz-tap{flex:1;min-height:0}
.focusbtn{width:100%;justify-content:center;margin-bottom:14px;background:var(--rose);color:var(--paper)}
.focus{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.fz-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fz-top b{font-family:var(--serif);font-size:22px;display:block}
.fz-top span{color:var(--muted);font-size:13px}
.fz-tap{border:2px solid var(--line);background:var(--paper);border-radius:22px;display:grid;place-content:center;justify-items:center;gap:10px;touch-action:manipulation;user-select:none;-webkit-user-select:none;padding:16px}
.fz-tap:active{background:var(--green-soft)}
.fz-tap.is-done{cursor:default}
.fz-kind{font-family:var(--serif);font-size:clamp(34px,10vw,64px);font-weight:700;color:var(--green);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;justify-content:center}
.fz-kind.dec{color:var(--rose)}
.fz-kind small{font-size:16px;font-weight:400;color:var(--muted)}
.fz-num{font-family:var(--serif);font-size:clamp(90px,30vw,180px);line-height:1;font-variant-numeric:tabular-nums}
.fz-num small{font-size:.25em;color:var(--muted)}
.fz-sub{color:var(--muted);font-size:15px;text-align:center}
.fz-hint{color:var(--muted);font-size:12px;letter-spacing:.06em;margin-top:8px}
.fz-bot{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.fz-bot .btn{justify-content:center;padding:14px}
.diag{margin-top:14px;padding:0;overflow:hidden}
.diag summary{padding:12px 16px;cursor:pointer;font-weight:500;color:var(--green)}
.diag-body{padding:0 12px 14px;display:grid;gap:10px}
.diag-body>svg{width:100%;height:auto;max-width:520px;justify-self:center}
.nowstrip{margin-top:14px;display:grid;gap:8px}
.focus .fz-tap{max-height:42vh}
.focus .fz-bot{margin-top:auto}
.focus .nowstrip .lbl{font-size:14px}
.reprow{display:flex;align-items:center;gap:10px}
.repbadge{font-size:13px;font-weight:700;color:var(--rose);white-space:nowrap}
.repbar{flex:1;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.repbar i{display:block;height:100%;background:var(--rose)}
.nowstrip .lbl{font-size:12px;letter-spacing:.08em;color:var(--rose);font-weight:500}
.gridhead{font-weight:500;font-size:14px;margin-top:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{font-style:normal;display:inline-grid;place-items:center;width:13px;height:13px;font-size:9px;border:1px solid var(--line);color:var(--muted)}
.gridwrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.gridwrap svg{display:block}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph button{position:absolute;top:6px;right:6px;border:0;background:rgba(20,15,12,.62);color:#fff;border-radius:99px;font-size:12px;padding:2px 9px}
.addph{border:1.5px dashed var(--muted);border-radius:10px;aspect-ratio:1;display:grid;place-items:center;color:var(--muted);font-size:13px;cursor:pointer;text-align:center;max-width:100%}
.addph input{position:absolute;opacity:0;width:1px;height:1px}
.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px;max-width:100%}
.viewer{position:fixed;inset:0;background:rgba(10,8,6,.88);display:grid;place-items:center;z-index:25;padding:16px}
.viewer img{max-height:88vh;border-radius:10px}
.aistat{font-size:14px;color:var(--green);margin:0}
.aistat.err{color:var(--rose)}
.arr{color:var(--muted);font-size:12px}
.now{padding:16px 18px;border-left:4px solid var(--rose);display:grid;gap:4px}
.now .lbl{font-size:12px;color:var(--rose);letter-spacing:.1em;font-weight:500}
.now p{margin:0;font-size:16px}
.rounds{display:grid}
.rd{display:grid;grid-template-columns:56px 1fr 52px;gap:10px;padding:10px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;align-items:start}
.rd:first-child{border-top:0}
.rd .n{font-family:var(--serif);color:var(--muted);font-variant-numeric:tabular-nums}
.rd .c{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.rd.done .t{color:var(--muted)}
.rd.cur{background:var(--rose-soft)}
.rd.cur .n,.rd.cur .c{color:var(--rose);font-weight:700}
.sec{display:grid;gap:12px;margin-top:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.yarn{padding:16px;display:grid;gap:10px}
.yhead{display:flex;gap:12px;align-items:center}
.skein{width:44px;height:44px;border-radius:50%;flex:none;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.18) 0 3px,transparent 3px 7px);border:1px solid var(--line)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13px}
dt{color:var(--muted)}
dd{margin:0;min-width:0;overflow-wrap:anywhere}
.edit{border:0;background:none;color:var(--green);font-size:13px;padding:0}
.empty{padding:28px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.calc{padding:18px;display:grid;gap:12px}
.calc .out{font-family:var(--serif);font-size:20px}
.calc .out b{color:var(--rose)}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;width:100%;color:var(--ink)}
.f textarea{min-height:180px;resize:vertical;font-size:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .wide{grid-column:1/-1}
.sheet{position:fixed;inset:0;background:rgba(20,15,12,.45);display:grid;place-items:end center;z-index:20}
.sheet>form{background:var(--paper);width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.hint{font-size:12px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;z-index:30}
.sync{font-size:12px;color:var(--muted);padding:0 8px;margin-top:auto}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);background:var(--paper);z-index:10}
  .brand,.sync{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px}
  main{padding-block:20px 110px}
  h1{font-size:24px}
  .cbox .num{font-size:46px}
  .proj{grid-template-columns:72px 1fr}
}
@media (max-width:560px){.counter{grid-template-columns:1fr}}
@media (max-width:420px){.fields{grid-template-columns:1fr}}

</style>

<script>window.CROCHET_SEED={"patterns": [{"id": "isonona", "group": "法鬥耳朵頭套（狗狗護耳圍脖帽）", "part": "頭套主體（頸筒＋頭部）", "name": "法鬥耳朵頭套（狗狗護耳圍脖帽）－頭套主體（頸筒＋頭部）", "cat": "寵物服飾", "source": "照片推算的初版", "notes": "整體：【材料】五股牛奶棉（米色/奶茶色）約100～120g、4mm鉤針、記號扣3～4個、毛線縫針、剪刀、皮尺。不需要五金和填充棉。\n【密度】短針約18針×20行＝10cm。請先鉤10cm樣片確認，太緊就換4.5mm鉤針，太鬆就換3.5mm。\n【尺寸】依照片推估是中型法鬥。頸圍筒周長約44cm（要能從頭套進去），頸筒高約10cm，頭部高約10cm，臉洞寬約14cm。\n【調整】先量狗狗的頭圍，再加2～4cm。主體針數＝周長(cm)×1.8，取最接近的偶數。臉洞約佔總針數的1/3，其餘針數拿來鉤頭部片。\n【小技巧】照片的直條紋質感，可以在主體每一圈都只鉤前一圈的「後半針」做出來，針數不變。\n【鉤法說明】主體第1～20圈是圈鉤，每圈結束引拔到第1針。第21圈起改成來回片鉤，每行結束鎖1針再翻面，這個鎖針不算針數。\n【組裝順序】\n1. 鉤頭套主體：頸筒，接頭部片，片上要留耳洞。\n2. 把主體最後一行（54針）對折，第1針對第54針、第27針對第28針，用毛線針縫合或引拔接合，做成頭頂縫線。\n3. 沿臉洞鉤臉洞收邊。\n4. 鉤2片耳套。\n5. 把耳套底邊（16針）縫在耳洞上：中間8針對齊耳洞後緣，兩側各4針往前包住耳洞兩端，讓耳套形成一個朝前開口的弧形殼。戴的時候狗狗的真耳朵從耳洞穿出來，躲進耳套裡。\n6. 藏好所有線頭。試戴後，如果臉洞太緊，可以把收邊少鉤1圈。\n鉤1個，米色，不填棉。第1圈的接合處就是臉洞的左邊緣，請放記號扣。第1～20圈是圈鉤的頸筒。第21圈起只鉤54針，剩下26針不鉤，留作臉洞下緣，之後改成來回片鉤。第35行的「鎖針8」要跳過下面8針不鉤，做成耳洞；第36行要鉤進這些鎖針裡。", "text": "1: 鎖針80起針，頭尾引拔成圈，從第1針鎖針開始 短針80（共80針）\n2-20: 短針80（共80針）\n21: 從記號扣那針開始 短針54（共54針）\n22-34: 短針54（共54針）\n35: 短針5、鎖針8、短針28、鎖針8、短針5（共54針）\n36-40: 短針54（共54針）", "photos": ["98ceeaf85775681899a00eba0ef4c446", "d0aa45668ffe65ffe2534a22d55fb367"]}, {"id": "zshb5zi", "group": "法鬥耳朵頭套（狗狗護耳圍脖帽）", "part": "臉洞收邊", "name": "法鬥耳朵頭套（狗狗護耳圍脖帽）－臉洞收邊", "cat": "寵物服飾", "source": "照片推算的初版", "notes": "鉤1個，米色，不填棉。主體頂部縫好以後，直接在臉洞邊緣鉤。從臉洞下緣右側開始，沿下緣26針、兩側各約20行（每行鉤1針）繞一圈，每圈結束引拔到第1針。如果覺得邊緣太鬆，可以在兩側各減幾針。", "text": "1: 從臉洞下緣右側開始 短針66（共66針）\n2-3: 短針66（共66針）", "photos": ["98ceeaf85775681899a00eba0ef4c446", "d0aa45668ffe65ffe2534a22d55fb367"]}, {"id": "paghpir", "group": "法鬥耳朵頭套（狗狗護耳圍脖帽）", "part": "耳套", "name": "法鬥耳朵頭套（狗狗護耳圍脖帽）－耳套", "cat": "寵物服飾", "source": "照片推算的初版", "notes": "鉤2個，米色，不填棉。從耳尖往下片鉤，每行結束鎖1針翻面，鎖針不算針數。第19行沿兩側斜邊鉤一行短針，做出加厚的耳緣。鉤完後，底邊16針縫到主體耳洞上。", "text": "1: 鎖針3起針，從鉤針數過去第2針鎖針開始 短針2（共2針）\n2: 加2（共4針）\n3: 短針4（共4針）\n4: 加1、短針2、加1（共6針）\n5: 短針6（共6針）\n6: 加1、短針4、加1（共8針）\n7: 短針8（共8針）\n8: 加1、短針6、加1（共10針）\n9: 短針10（共10針）\n10: 加1、短針8、加1（共12針）\n11: 短針12（共12針）\n12: 加1、短針10、加1（共14針）\n13: 短針14（共14針）\n14: 加1、 const KIND={'下針':'下針','上針':'上針','收針':'收針','起針':'起針','外鉤長針':'外鉤長針','內鉤長針':'內鉤長針','短':'短針','短針':'短針','減':'減針','減針':'減針','加':'加針','加針':'加針','中長針':'中長針','長針':'長針','鎖針':'鎖針','引拔':'引拔'};
function parseSteps(text){
  const steps=[];const re=/(外鉤長針|內鉤長針|中長針|長針|鎖針|引拔|短針|下針|上針|收針|起針|減針|加針|短|減|加)\s*(\d+)/g;let m;
  while((m=re.exec(text))){if((m[1]==='起針'||m[1]==='收針')&&/\s/.test(m[0]))continue;steps.push({k:KIND[m[1]],n:+m[2]})}
  if(!steps.length)return null;
  const rep=+((text.match(/[×xX＊*]\s*(\d+)/)||[])[1])||1;
  const skipCh=/跳過/.test(text);const knit=/下針|上針/.test(text);
  const actions=[];
  for(let r=0;r<rep;r++)steps.forEach((s,si)=>{for(let i=0;i<s.n;i++)actions.push({r,si,i,w:s.k==='加針'?(knit?1:2):(s.k==='引拔'||s.k==='收針')?0:s.k==='鎖針'?(skipCh?1:0):1})});
  return {steps,rep,actions};
}

function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseRounds(text){
  const out=[];
  for(const line of String(text||'').split('\n')){
    const m=line.trim().match(/^(\d+)\s*(?:[-~～到]\s*(\d+))?\s*[:：.、]?\s*(.*)$/);
    if(!m)continue;
    const a=+m[1],b=m[2]?+m[2]:a,body=m[3];
    const cm=body.match(/[（(]\s*共?\s*(\d+)\s*[針vV]?\s*[)）]\s*$/);
    const t=cm?body.slice(0,cm.index).trim():body.trim();
    for(let n=a;n<=Math.min(b,a+200);n++)out.push({n,text:t,count:cm?+cm[1]:null});
  }
  return out.sort((x,y)=>x.n-y.n);
}

function stepBox(p,seq,cur){
  const V=/下針|上針/.test(cur&&cur.text||'')?'織':'鉤';
  const n=seq.actions.length, done=Math.min(p.stitch||0,n);
  const out=k=>seq.actions.slice(0,k).reduce((t,x)=>t+x.w,0);
  if(done>=n)return `<div class="card cbox stepbox"><span class="lbl">這圈完成</span><div class="num ok">✓</div>
    <span class="target">共${V}了 <b>${out(n)}</b> 針${cur.count?`，應有 ${cur.count} 針`:''}</span>
    <div class="pm"><button data-act="stitch" data-d="-1" aria-label="退一步">−</button><button class="plus" data-act="round" data-d="1">＋ 下一圈</button></div></div>`;
  const a=seq.actions[done], s=seq.steps[a.si], nx=seq.actions[done+s.n-a.i];
  const nextStep=nx?seq.steps[nx.si]:null;
  return `<div class="card cbox stepbox"><span class="lbl">${seq.rep>1?`第 ${a.r+1} / ${seq.rep} 次 · `:''}現在要${V}</span>
    <div class="kind ${s.k==='減針'?'dec':''}">${s.k}${s.k==='減針'?'<small>2 併 1</small>':s.k==='加針'?'<small>同一針鉤 2 針</small>':s.k==='鎖針'?'<small>不算進這圈針數</small>':''}</div>
    <div class="num">${a.i+1}<small> / ${s.n}</small></div>
    <span class="target">${nextStep?`接下來：${nextStep.k} ${nextStep.n}`:'這是這圈最後一段'} · 已${V} ${out(done)} / ${out(n)} 針</span>
    <div class="pm"><button data-act="stitch" data-d="-1" aria-label="退一針">−</button><button class="plus" data-act="stitch" data-d="1" aria-label="${V}好一針">＋1 ${V}好了</button></div>
    <button class="edit" data-act="stitch-reset">這圈重來</button></div>`;
}
function stepStrip(p,seq){
  const n=seq.actions.length, done=Math.min(p.stitch||0,n), a=seq.actions[Math.min(done,n-1)], fin=done>=n;
  const segs=seq.steps.map((st,si)=>{const cls=fin?'past':si<a.si?'past':si===a.si?'on':'';return `<span class="seg ${cls} ${st.k==='減針'?'dec':''}">${st.k} ${st.n}</span>`}).join('<span class="arr">›</span>');
  const rep=seq.rep>1?`<div class="reprow"><span class="repbadge">第 ${fin?seq.rep:a.r+1} / ${seq.rep} 次</span><span class="repbar"><i style="width:${Math.round((fin?seq.rep:a.r)/seq.rep*100)}%"></i></span></div>`:'';
  return `<div class="card strip">${rep}<div class="srow">${segs}</div>${seq.rep>1?'<span class="hint">這一段重複做，做完一次會自動從頭再來</span>':''}</div>`;
}

function patternGroups(){

  for(const p of S.patterns){const k=p.group||(String(p.name).includes('－')?String(p.name).split('－')[0]:'#'+p.id);
    if(!map.has(k))map.set(k,{name:k.startsWith('#')?p.name:k,items:[]});map.get(k).items.push(p)}
  return [...map.values()];
}

function runCalc(){
  const o=document.getElementById('c-out');if(!o)return;
  const s=byId(S.swatches,document.getElementById('c-sw').value);const w=+document.getElementById('c-w').value,h=+document.getElementById('c-h').value;
  if(!s||!(+s.sts)){o.innerHTML='<span class="hint">這片樣片還沒填每 10 公分的針數</span>';return}
  const st=Math.round(+s.sts/10*w), rw=s.rows?Math.round(+s.rows/10*h):null;
  o.innerHTML=`起 <b>${st||0}</b> 針${rw!=null?`，鉤 <b>${rw}</b> 圈`:''}`;
}

function openForm(kind,item){
  const isNew=!item; item=item||{};
  const fields=FORMS[kind]();
  const html=fields.map(([k,l,t,cls,opts])=>{
    const v=item[k]??(t==='color'?'#B9A89A':k==='status'?'active':k==='round'?1:'');
    let ctl;
    if(t==='select')ctl=`<select id="f-${k}" name="${k}">${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
    else if(t==='textarea')ctl=`<textarea id="f-${k}" name="${k}" ${k==='text'?'placeholder="5: 短針7、減1、短針11 ×2（共80針）\n6-7: 短針40 ×2（共80針）"':''}>${esc(v)}</textarea>`;
    else ctl=`<input id="f-${k}" name="${k}" type="${t}" ${t==='number'?'inputmode="numeric"':''} value="${esc(v)}">`;
    return `<label class="f ${cls||''}">${l}${ctl}${k==='text'?'<span class="hint">一行一圈，開頭寫圈數，多圈相同可寫「6-7:」。照「短針7、減1、短針11 ×2（共80針）」的寫法，鉤的時候會一針一針帶你走；×2 代表整段做兩次，括號裡是這圈總針數。</span>':''}</label>`;
  }).join('');
  const L=document.getElementById('layer');
  L.innerHTML=`<div class="sheet" data-close><form id="sheet-form"><div class="row"><h2>${isNew?'新增':'編輯'}${TITLES[kind]}</h2><button type="button" class="edit" data-close>取消</button></div>
   <div class="fields">${html}</div>
   <div class="row">${isNew?'<span></span>':`<button type="button" class="btn danger" id="del">刪除</button>`}<button class="btn" type="submit">儲存</button></div></form></div>`;
  const form=document.getElementById('sheet-form');
  form.querySelector('input,textarea')?.focus();
  form.onsubmit=e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(form));
    if(!String(d.name||'').trim()){form.querySelector('[name=name]').focus();toast('請先填名稱');return}
    if(kind==='project'){d.round=Math.max(1,+d.round||1);d.updated=Date.now();if(isNew)d.stitch=0}
    const arr=S[COLL[kind]];
    if(isNew){d.id=uid();arr.unshift(d);if(kind==='project'){view.tab='projects';view.open=d.id}}
    else Object.assign(item,d);
    closeForm();save();render();toast('已儲存');
  };
  const del=document.getElementById('del');
  if(del)del.onclick=()=>{
    if(!del.dataset.armed){del.dataset.armed=1;del.textContent='再按一次刪除';return}
    const arr=S[COLL[kind]];arr.splice(arr.indexOf(item),1);
    if(kind==='project')view.open=null; if(kind==='pattern')view.pattern=null;
    closeForm();save();render();toast('已刪除');
  };
}

async function shrink(file,max){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
  }finally{URL.revokeObjectURL(url)}
}

function stepsFor(p){const pat=byId(S.patterns,p.patternId),cur=patternRounds(pat).find(r=>r.n===p.round);return {cur,seq:cur&&parseSteps(cur.text)}}
function stitchMove(p,d){
  const {seq}=stepsFor(p);const max=seq?seq.actions.length:Infinity;
  const was=p.stitch||0;let nv=Math.max(0,Math.min(max,was+d));
  if(nv===was){if(d>0&&seq)toast('這圈完成了，按「下一圈」');return}
  p.stitch=nv;save();render();
  try{if(d>0&&navigator.vibrate)navigator.vibrate(nv===max?[30,60,30]:15)}catch(e){}
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const VOICE_OK=!!SR&&!window.claude;
const voice={on:false,rec:null,heard:'',err:''};
const YI=/[一1１壹依衣醫伊揖]/g, BACK=/退|倒/g;
function voiceCount(text){
  const t=String(text).replace(/\s+/g,'').replace(/下一圈|上一圈/g,'');
  return {plus:(t.match(YI)||[]).length,minus:(t.match(BACK)||[]).length};
}
function voiceApply(plus,minus,heard){
  const p=byId(S.projects,view.open);if(!p)return;
  if(heard!=null)voice.heard=String(heard).trim().slice(-12);
  for(let i=0;i<minus;i++)stitchMove(p,-1);
  for(let i=0;i<plus;i++)stitchMove(p,1);
  if(!plus&&!minus)render();
}

const CN={'零':0,'一':1,'二':2,'兩':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
function numTokens(text){
  const out=[];const re=/[一二兩三四五六七八九]?十[一二三四五六七八九]?|[零一二兩三四五六七八九]|\d+/g;let m;
  const t=String(text).replace(/下一圈|上一圈/g,'');
  while((m=re.exec(t))){const w=m[0];
    if(/^\d+$/.test(w)){out.push({d:w})}
    else if(w.includes('十')){const [a,b]=w.split('十');out.push({v:(a?CN[a]:1)*10+(b?CN[b]:0)})}
    else out.push({v:CN[w]});}
  return out;
}
function tokenValue(tk,limit){
  if(tk.v!=null)return tk.v;
  const d=tk.d;if(+d<=limit)return +d;
  if(d.length>=2&&+d.slice(-2)<=limit&&+d.slice(-2)>0)return +d.slice(-2);
  return +d.slice(-1);
}
function countTo(tk){
  const p=byId(S.projects,view.open);if(!p)return;
  const {seq}=stepsFor(p);
  if(seq){const len=seq.actions.length,done=Math.min(p.stitch||0,len);if(done>=len)return;
    const a=seq.actions[done],sg=seq.steps[a.si],n=tokenValue(tk,sg.n);
    if(!(n>a.i))return;const adv=Math.min(n-a.i,sg.n-a.i,6);for(let i=0;i<adv;i++)stitchMove(p,1);}
  else{const cur=p.stitch||0,n=tokenValue(tk,999);if(n>cur&&n-cur<=6)for(let i=0;i<n-cur;i++)stitchMove(p,1);}
}
function voiceMode(){return ['sound','count'].includes(view.vmode)?view.vmode:'words'}
function voiceStart(){
  if(!VOICE_OK)return;
  voice.err='';voice.on=true;
  if(voiceMode()==='sound'){soundStart();return}
  const counting=voiceMode()==='count';
  const rec=new SR();rec.lang='zh-TW';rec.continuous=true;rec.interimResults=counting;rec.maxAlternatives=1;
  const seen={};
  rec.onresult=e=>{
    if(counting){
      for(let i=e.resultIndex;i<e.results.length;i++){
        const tx=e.results[i][0].transcript,tks=numTokens(tx),pv=seen[i]||{idx:-1,raw:''};
        const bk=(tx.match(/退/g)||[]).length,pb=seen['b'+i]||0;if(bk>pb){seen['b'+i]=bk;voiceApply(0,bk-pb,tx)}
        if(!tks.length)continue;
        const li=tks.length-1,lt=tks[li],raw=lt.d!=null?lt.d:String(lt.v);
        if(li>pv.idx||raw!==pv.raw){seen[i]={idx:li,raw};voice.heard=tx.trim().slice(-12);countTo(lt)}
      }
      return;
    }
    for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal){const tx=e.results[i][0].transcript,c=voiceCount(tx);voiceApply(c.plus,c.minus,tx)}}
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){voice.on=false;voice.err='沒有麥克風權限。請到 Safari 的網站設定允許麥克風，再按一次「聲控」。';render()}
    else if(e.error==='audio-capture'){if(voice.snd){soundStop();voice.noMeter=true;voice.err='這支手機不能同時顯示音量條，已關掉音量條';render();return}voice.on=false;voice.err='找不到麥克風';render()}
  };
  rec.onend=()=>{if(voice.on&&voice.rec===rec){for(const k in seen)delete seen[k];setTimeout(()=>{if(voice.on&&voice.rec===rec){try{rec.start()}catch(err){}}},250)}};
  voice.rec=rec;
  try{rec.start()}catch(err){voice.on=false;voice.err='聲控沒辦法啟動，請再按一次';return}
}
/* quick mode: any short sound (say "一" or tap the table) = +1, decided on the phone, no word recognition */
async function soundStart(meterOnly){
  const AC=window.AudioContext||window.webkitAudioContext;
  let ctx=null;
  try{ctx=new AC();ctx.resume&&ctx.resume()}catch(e){}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    if(!voice.on){stream.getTracks().forEach(t=>t.stop());try{ctx&&ctx.close()}catch(e){}return}
    if(!ctx)ctx=new AC();
    const src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();an.fftSize=1024;src.connect(an);
    const buf=new Uint8Array(an.fftSize);let floor=0.004,armed=true,lastHit=0,quietSince=0,peak=0;
    const state={stream,ctx,raf:0,timer:0,meterOnly:!!meterOnly};voice.snd=state;
    const tick=()=>{
      if(!voice.on||voice.snd!==state)return;
      an.getByteTimeDomainData(buf);let sum=0;for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;sum+=v*v}
      const rms=Math.sqrt(sum/buf.length);
      const sens=view.vsens||2;
      const th=Math.max([0.03,0.015,0.008][sens-1],floor*[4,3,2.2][sens-1]);
      const now=performance.now();
      if(rms<th*0.7){floor=floor*0.98+rms*0.02;if(!quietSince)quietSince=now;if(now-quietSince>100)armed=true}else quietSince=0;
      if(!meterOnly&&armed&&rms>th&&now-lastHit>250){armed=false;lastHit=now;voiceApply(1,0,'（聲音）')}
      peak=Math.max(rms,peak*0.9);
      const L=document.getElementById('lvl'),T=document.getElementById('thr');
      if(L)L.style.width=Math.min(100,peak/0.1*100)+'%';
      if(T)T.style.left=meterOnly?'-10px':Math.min(100,th/0.1*100)+'%';
    };
    state.timer=setInterval(tick,20);
    if(ctx.state==='suspended'){try{await ctx.resume()}catch(e){}}
    render();
  }catch(e){try{ctx&&ctx.close()}catch(x){}if(meterOnly){voice.noMeter=true;render();return}voice.on=false;voice.err=e&&e.name==='NotAllowedError'?'沒有麥克風權限。請到 Safari 的網站設定允許麥克風，再按一次「聲控」。':'快速模式沒辦法啟動（'+(e&&e.name||'未知')+'），請改用「說一」模式';render()}
}
function soundStop(){const st=voice.snd;voice.snd=null;if(!st)return;clearInterval(st.timer);try{st.stream.getTracks().forEach(t=>t.stop())}catch(e){}try{st.ctx.close()}catch(e){}}
function voiceStop(){voice.on=false;const r=voice.rec;voice.rec=null;voice.heard='';if(r){try{r.stop()}catch(e){}}soundStop()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&voice.on){voiceStop();render()}});
let wakeLock=null;
async function wake(on){
  try{
    if(on&&navigator.wakeLock&&document.visibilityState==='visible'){wakeLock=await navigator.wakeLock.request('screen')}
    else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}
  }catch(e){wakeLock=null}
}
document.addEventListener('visibilitychange',()=>{if(view.focus&&document.visibilityState==='visible')wake(true)});
function focusView(p){
  const {cur,seq}=stepsFor(p);const V=/下針|上針/.test(cur&&cur.text||'')?'織':'鉤';const pat=byId(S.patterns,p.patternId);
  let main,sub='',done=false;
  if(seq){
    const n=seq.actions.length,k=Math.min(p.stitch||0,n);
    const out=x=>seq.actions.slice(0,x).reduce((t,y)=>t+y.w,0);
    if(k>=n){done=true;main=`<div class="fz-kind ok">✓ 這圈完成</div><div class="fz-num">${out(n)}<small> 針</small></div>`;sub='按下方「＋ 下一圈」繼續';}
    else{const a=seq.actions[k],s=seq.steps[a.si],nx=seq.actions[k+s.n-a.i],ns=nx?seq.steps[nx.si]:null;
      main=`<div class="fz-kind ${s.k==='減針'?'dec':''}">${s.k}${s.k==='減針'?'<small>2 併 1</small>':s.k==='加針'?'<small>同一針 2 針</small>':''}</div><div class="fz-num">${a.i+1}<small> / ${s.n}</small></div>`;
      sub=`${seq.rep>1?`第 ${a.r+1}/${seq.rep} 次 · `:''}${ns?`接下來 ${ns.k} ${ns.n}`:'最後一段'} · 已${V} ${out(k)}/${out(n)}`;}
  }else{main=`<div class="fz-kind">針數</div><div class="fz-num">${p.stitch||0}${cur&&cur.count?`<small> / ${cur.count}</small>`:''}</div>`}
  return `<div class="focus">
    <div class="fz-top"><div><b>第 ${p.round} 圈</b><span>${esc(pat?partName(pat):p.name)}</span></div><div class="row">${VOICE_OK?`<button class="btn ${voice.on?'':'ghost'} micbtn" data-act="voice" aria-pressed="${voice.on}">${voice.on?'<i class="dot"></i> 聲控中':'🎤 聲控'}</button>`:''}<button class="btn ghost" data-act="focus-off">離開</button></div></div>
    ${VOICE_OK?`<div class="vmodes"><button class="chip" data-act="vmode" data-m="words" aria-pressed="${voiceMode()==='words'}">說「一」</button><button class="chip" data-act="vmode" data-m="count" aria-pressed="${voiceMode()==='count'}">數數</button><button class="chip" data-act="vmode" data-m="sound" aria-pressed="${voiceMode()==='sound'}">快速：有聲音就 +1</button>${voiceMode()==='sound'?`<button class="chip" data-act="vsens">靈敏度：${['低','中','高'][(view.vsens||2)-1]}</button>`:''}</div>`:''}
    ${voice.on?`<div class="heard">${voiceMode()==='sound'?'說「一」、出聲或輕敲桌面都會 +1，反應最快；周圍安靜時最準':voiceMode()==='count'?'邊鉤邊數「一、二、三…」，數到幾就是這段第幾針；每段重新從一數起':'說「一」＝ 加一針　說「退」＝ 退一針'}${voice.heard?`　·　剛剛：${esc(voice.heard)}`:''}</div>`:''}${voice.on&&(voiceMode()==='sound'||voice.snd)?`<div class="meter" aria-hidden="true"><i id="lvl"></i><b id="thr"></b></div><div class="heard" style="color:var(--muted)">${voiceMode()==='sound'?'出聲時綠條要超過紅線才會 +1，超不過就把靈敏度調高':'綠條會跟著你的聲音跳，代表手機有聽到'}</div>`:''}${voice.err?`<div class="heard err">${esc(voice.err)}</div>`:''}
    <button class="fz-tap ${done?'is-done':''}" data-act="stitch" data-d="1" aria-label="${V}好一針">${main}<span class="fz-sub">${sub}</span>${done?'':`<span class="fz-hint">點這裡任何地方 ＝ ${V}好一針</span>`}</button>
    ${pat?rowStrip(pat,p,true):''}
    <div class="fz-bot"><button class="btn ghost" data-act="stitch" data-d="-1">− 退一針</button><button class="btn" data-act="round" data-d="1">＋ 下一圈</button></div>
  </div>`;
}

render();

/* account sync: one private document per signed-in person */
(async()=>{
  try{
    const c=window.claude; if(!c||!c.use)return;
    const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
    const id=user&&await user.id();
    if(db&&id){
      store=db.doc('data/users/'+id+'/book');
      const snap=await store.get();
      const d=snap.exists&&snap.data();
      if(d&&d.json){S=JSON.parse(d.json);migrate();try{localStorage.setItem('crochet-book',d.json)}catch(e){}render()}
      setSync('已同步到你的帳號');
    }
  }catch(e){store=null}
  try{
    const c=window.claude; if(!c||!c.use)return;
    const [as,sm]=await Promise.all([c.use('assets'),c.use('sample')]);
    assets=as; sample=sm;
    if(sample){const lim=await sample.limits().catch(()=>null);canImages=!!(lim&&lim.images);if(lim&&lim.images&&lim.images.maxCount)imgMax=Math.min(3,lim.images.maxCount)}
    render();
  }catch(e){}
})();
