<style>

:root[data-theme="dark"]{
  --bg:#1B1917; --paper:#25221F; --ink:#EEE6DC; --muted:#A99D92; --line:#3A3531;
  --rose:#E19AA0; --rose-soft:#3D2B2C; --green:#93C2A4; --green-soft:#22322A; --on-green:#16201A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}

dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13px}

dd{margin:0;min-width:0;overflow-wrap:anywhere}
.edit{border:0;background:none;color:var(--green);font-size:13px;padding:0}
.empty{padding:28px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.calc{padding:18px;display:grid;gap:12px}
.calc .out{font-family:var(--serif);font-size:20px}
.calc .out b{color:var(--rose)}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;width:100%;color:var(--ink)}

.hint{font-size:12px;color:var(--muted);margin:0}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);background:var(--paper);z-index:10}
  .brand,.sync{display:none}

<script>
const ICONS={
 projects:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8h14l-1.2 11.5a1.5 1.5 0 0 1-1.5 1.5H7.7a1.5 1.5 0 0 1-1.5-1.5Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
 patterns:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.3h16M4 14.6h16M9.3 4v16M14.6 4v16"/></svg>',
 yarns:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M5 9c4 1 9 1 14-1M4.5 14c5 1 10 1 15-1M8 19.5c2-5 6-11 9-14"/></svg>',
 swatches:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="6" width="16" height="12" rx="1.5"/><path d="M4 10h16M8 6v3M12 6v3M16 6v3"/></svg>'
};
const TABS=[['projects','作品'],['patterns','圖解'],['yarns','線材'],['swatches','樣片']];
const STATUS={active:'進行中',paused:'暫停',finishing:'收尾',done:'完成'};

const BAG_PATTERN=`1: 起針 36 針，從倒數第二針開始，包底第 1 圈（共72針）
2: 包底第 2 圈（共76針）
3: 包底第 3 圈（共84針）
4: 包身開始 短針43 ×2（共86針）
5: 短針7、減1、短針11、減1、短針12、減1、短針7 ×2（共80針）
6-7: 短針40 ×2（共80針）
8: 短針8、減1、短針9、減1、短針9、減1、短針8 ×2（共74針）
9: 短針37 ×2（共74針）
10: 短針9、減1、短針6、減1、短針7、減1、短針9 ×2（共68針）
11-12: 短針34 ×2（共68針）
13: 短針10、減1、短針10、減1、短針10 ×2（共64針）
14-15: 短針32 ×2（共64針）
16: 短針6、減1、短針16、減1、短針6 ×2（共60針）
17: 短針30 ×2（共60針）
18: 短針14、減1、短針14 ×2（共58針）
19: 短針29 ×2（共58針）
20: 短針13、減1、短針14 ×2（共56針）
21: 短針13、減1、短針13 ×2，引拔結束（共54針）`;
const OLD_BAG_START='5: 每片兩邊第 8 針減 1 針';
const BAG_NOTES='記號扣掛在兩端 9 針的第 5 針（正中間）。從記號扣開始，每行是半圈的順序，「×2」代表另一半照做一次。減1＝短針 2 併 1。';
const PROJ_NOTES='兩側各 9 針、前後片各 34 針，整圈 86 針。';

/* "短針7、減1、短針11 ×2" -> steps + repeat */
const KIND={'短':'短針','短針':'短針','減':'減針','減針':'減針','加':'加針','加針':'加針','中長針':'中長針','長針':'長針','鎖針':'鎖針','引拔':'引拔'};
function parseSteps(text){
  const steps=[];const re=/(中長針|長針|鎖針|引拔|短針|減針|加針|短|減|加)\s*(\d+)/g;let m;
  while((m=re.exec(text))){steps.push({k:KIND[m[1]],n:+m[2]})}
  if(!steps.length)return null;
  const rep=+((text.match(/[×xX＊*]\s*(\d+)/)||[])[1])||1;
  const actions=[];
  for(let r=0;r<rep;r++)steps.forEach((s,si)=>{for(let i=0;i<s.n;i++)actions.push({r,si,i,w:s.k==='加針'?2:(s.k==='引拔'||s.k==='鎖針')?0:1})});
  return {steps,rep,actions};
}
function migrate(){
  const bp=S.patterns&&S.patterns.find(p=>p.id==='bagpattern');
  if(bp&&String(bp.text||'').includes(OLD_BAG_START)){bp.text=BAG_PATTERN;bp.notes=BAG_NOTES}
  const pj=S.projects&&S.projects.find(p=>p.id==='bag');
  if(pj&&String(pj.notes||'').includes('第 8 針減針'))pj.notes=PROJ_NOTES;
  S.v=2;
}

function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseRounds(text){
  const out=[];
  for(const line of String(text||'').split('\n')){
    const m=line.trim().match(/^(\d+)\s*(?:[-~～到]\s*(\d+))?\s*[:：.、]?\s*(.*)$/);
    if(!m)continue;
    const a=+m[1],b=m[2]?+m[2]:a,body=m[3];
    const cm=body.match(/[（(]\s*共?\s*(\d+)\s*[針vV]?\s*[)）]\s*$/);
    const t=cm?body.slice(0,cm.index).trim():body.trim();
    for(let n=a;n<=Math.min(b,a+200);n++)out.push({n,text:t,count:cm?+cm[1]:null});
  }
  return out.sort((x,y)=>x.n-y.n);
}
function defaults(){
  const pid='bagpattern';
  return {v:1,
    patterns:[{id:pid,name:'梯形托特包',cat:'包包',source:'小紅書圖解',text:BAG_PATTERN,notes:BAG_NOTES}],
    projects:[{id:'bag',name:'黑色梯形包',status:'active',patternId:pid,yarnId:'blackyarn',hook:'',color:'#2B2A2C',round:5,stitch:0,notes:PROJ_NOTES,updated:Date.now()}],

function stepBox(p,seq,cur){
  const n=seq.actions.length, done=Math.min(p.stitch||0,n);
  const out=k=>seq.actions.slice(0,k).reduce((t,x)=>t+x.w,0);
  if(done>=n)return `<div class="card cbox stepbox"><span class="lbl">這圈完成</span><div class="num ok">✓</div>
    <span class="target">共鉤了 <b>${out(n)}</b> 針${cur.count?`，應有 ${cur.count} 針`:''}</span>
    <div class="pm"><button data-act="stitch" data-d="-1" aria-label="退一步">−</button><button class="plus" data-act="round" data-d="1">＋ 下一圈</button></div></div>`;
  const a=seq.actions[done], s=seq.steps[a.si], nx=seq.actions[done+s.n-a.i];
  const nextStep=nx?seq.steps[nx.si]:null;
  return `<div class="card cbox stepbox"><span class="lbl">${seq.rep>1?`第 ${a.r+1} / ${seq.rep} 次 · `:''}現在要鉤</span>
    <div class="kind ${s.k==='減針'?'dec':''}">${s.k}${s.k==='減針'?'<small>2 併 1</small>':s.k==='加針'?'<small>同一針鉤 2 針</small>':s.k==='鎖針'?'<small>不算進這圈針數</small>':''}</div>
    <div class="num">${a.i+1}<small> / ${s.n}</small></div>
    <span class="target">${nextStep?`接下來：${nextStep.k} ${nextStep.n}`:'這是這圈最後一段'} · 已鉤 ${out(done)} / ${out(n)} 針</span>
    <div class="pm"><button data-act="stitch" data-d="-1" aria-label="退一針">−</button><button class="plus" data-act="stitch" data-d="1" aria-label="鉤好一針">＋1 鉤好了</button></div>
    <button class="edit" data-act="stitch-reset">這圈重來</button></div>`;
}
function stepStrip(p,seq){
  const n=seq.actions.length, done=Math.min(p.stitch||0,n), a=seq.actions[Math.min(done,n-1)];
  const curR=done>=n?seq.rep:a.r;
  let html='';
  for(let r=0;r<seq.rep;r++){
    html+=`<div class="srow">${seq.rep>1?`<span class="rlab">${r===0?'前半':'後半'}</span>`:''}${seq.steps.map((s,si)=>{
      const st=r<curR||(r===curR&&si<a.si)||done>=n?'past':(r===curR&&si===a.si?'on':'');
      return `<span class="seg ${st} ${s.k==='減針'?'dec':''}">${s.k} ${s.n}</span>`}).join('<span class="arr">›</span>')}</div>`;
  }
  return `<div class="card strip">${html}</div>`;
}

function partName(p){return p.part||(String(p.name).includes('－')?String(p.name).split('－').slice(1).join('－'):p.name)}
function patternGroups(){

}

function singleCard(p){const used=S.projects.filter(x=>x.patternId===p.id).length;

async function shrink(file,max){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
  }finally{URL.revokeObjectURL(url)}
}

    <div class="fz-top"><div><b>第 ${p.round} 圈</b><span>${esc(pat?partName(pat):p.name)}</span></div><div class="row">${VOICE_OK?`<button class="btn ${voice.on?'':'ghost'} micbtn" data-act="voice" aria-pressed="${voice.on}">${voice.on?'<i class="dot"></i> 聲控中':'🎤 聲控'}</button>`:''}<button class="btn ghost" data-act="focus-off">離開</button></div></div>
    ${VOICE_OK?`<div class="vmodes"><button class="chip" data-act="vmode" data-m="words" aria-pressed="${voiceMode()==='words'}">說「一」</button><button class="chip" data-act="vmode" data-m="sound" aria-pressed="${voiceMode()==='sound'}">快速：有聲音就 +1</button>${voiceMode()==='sound'?`<button class="chip" data-act="vsens">靈敏度：${['低','中','高'][(view.vsens||2)-1]}</button>`:''}</div>`:''}
    ${voice.on?`<div class="heard">${voiceMode()==='sound'?'說「一」、出聲或輕敲桌面都會 +1，反應最快；周圍安靜時最準':'說「一」＝ 加一針　說「退」＝ 退一針'}${voice.heard?`　·　剛剛：${esc(voice.heard)}`:''}</div>`:''}${voice.err?`<div class="heard err">${esc(voice.err)}</div>`:''}
    <button class="fz-tap ${done?'is-done':''}" data-act="stitch" data-d="1" aria-label="鉤好一針">${main}<span class="fz-sub">${sub}</span>${done?'':'<span class="fz-hint">點這裡任何地方 ＝ 鉤好一針</span>'}</button>
    <div class="fz-bot"><button class="btn ghost" data-act="stitch" data-d="-1">− 退一針</button><button class="btn" data-act="round" data-d="1">＋ 下一圈</button></div>
  </div>`;
}

render();

/* account sync: one private document per signed-in person */
(async()=>{
  try{
    const c=window.claude; if(!c||!c.use)return;
    const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
    const id=user&&await user.id();
    if(db&&id){
      store=db.doc('data/users/'+id+'/book');
      const snap=await store.get();
      const d=snap.exists&&snap.data();
      if(d&&d.json){S=JSON.parse(d.json);migrate();try{localStorage.setItem('crochet-book',d.json)}catch(e){}render()}
      setSync('已同步到你的帳號');
    }
  }catch(e){store=null}
  try{
    const c=window.claude; if(!c||!c.use)return;
    const [as,sm]=await Promise.all([c.use('assets'),c.use('sample')]);
    assets=as; sample=sm;
    if(sample){const lim=await sample.limits().catch(()=>null);canImages=!!(lim&&lim.images);if(lim&&lim.images&&lim.images.maxCount)imgMax=Math.min(3,lim.images.maxCount)}
    render();
  }catch(e){}
})();
</script>
