  <section class="panel lesson">
    <span class="chip">${l.track==="kk"?"KK 音標":"自然發音"}・第 ${n} 課${S.phon[l.id]?"・已完成":""}</span>
    <h2 style="font-size:22px">${esc(l.title)}</h2><p style="margin:0">${esc(l.intro)}</p>
    <p class="muted" style="margin:0;font-size:13px">點音標旁的喇叭：先播放這個音（念兩次），再念一個例字。點單字可以單獨聽。</p>
    <div class="pitems">${l.items.map((it,ii)=>`<div class="pitem"><button class="psym" data-psym="${ii}" aria-label="聽 ${esc(it.s)} 的例字">${esc(it.s)}<span class="pspk">${IC.spk}</span></button><div class="ptxt">${esc(it.tip)}</div><div class="pex">${it.ex.map(pwBtn).join("")}</div></div>`).join("")}</div>
  </section>
  <button class="btn pri" data-start>開始聽力小測驗（${l.quiz.length} 題）</button>`;
  app.onclick=e=>{if(e.target.closest("[data-back]"))return go({name:"grammar"});
    const p=e.target.closest("[data-pw]");if(p)return speakPW(p.dataset.pw);const ps=e.target.closest("[data-psym]");if(ps)return readItem(l,l.items[+ps.dataset.psym],ps);
    if(e.target.closest("[data-start]")){PQ={l,i:0,ok:0,ans:-1,saved:false};go({name:"plesson",id:l.id,quiz:true})}}};
function speakPW(w,rate){RL++;try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel()}catch(e){}say(pwSay(w),"en-US",rate||.85)}
async function readItem(l,it,btn){const tok=++RL;ac();try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel()}catch(e){}
  document.querySelectorAll(".psym.on").forEach(b=>b.classList.remove("on"));if(btn)btn.classList.add("on");
  const snd=itemSound(l,it),letter=l.id==="p1"?it.s.split(" ")[0]:null;
  if(letter){await say(letter,"en-US",.8);if(tok!==RL)return;await wait(300)}
  if(snd){for(let r=0;r<2;r++){await playPhonemes(snd,tok);if(tok!==RL)return;await wait(380)}
    if(it.ex[0]){await wait(150);if(tok!==RL)return;await say(pwSay(it.ex[0]),"en-US",.75)}}
  else{for(const w of it.ex){if(tok!==RL)return;await say(pwSay(w),"en-US",.7);if(tok!==RL)return;await wait(500)}}
  if(btn&&tok===RL)btn.classList.remove("on")}
function pQuiz(l){const n=l.quiz.length;
  if(PQ.i>=n){if(!PQ.saved){PQ.saved=true;const prev=S.phon[l.id];S.phon[l.id]={best:Math.max(PQ.ok,prev?prev.best:0),d:todayStr()};dayState().gram++;save();markToday()}
    const list=COURSE.filter(c=>c.track===l.track),nx=list[list.indexOf(l)+1];
    app.innerHTML=`<section class="panel done" style="padding:28px 16px"><span style="font-size:42px" aria-hidden="true">${PQ.ok===n?"🎉":PQ.ok>=n/2?"👍":"💪"}</span>
      <div class="big">${PQ.ok}/${n}</div><h2>${esc(l.title)}</h2><p class="muted" style="margin:0">${PQ.ok===n?"耳朵很好！這一課的音都分得出來。":"聽錯的音回去多聽幾次例字，再試一次。"}</p></section>
      <div class="btns"><button class="btn ghost" data-re>回到這一課</button>${nx?`<button class="btn pri" data-nx="${nx.id}">下一課</button>`:`<button class="btn pri" data-list>回課程列表</button>`}</div>`;
    app.onclick=e=>{if(e.target.closest("[data-re]"))return go({name:"plesson",id:l.id});
      const b=e.target.closest("[data-nx]");if(b)return go({name:"plesson",id:b.dataset.nx});if(e.target.closest("[data-list]"))go({name:"grammar"})};return}
  const [w,opts]=l.quiz[PQ.i];
  app.innerHTML=`<div class="prog"><button class="back" data-quit aria-label="結束">✕</button><div class="bar"><div style="width:${PQ.i/n*100}%;background:var(--accent)"></div></div><span>${PQ.i}/${n}</span></div>
  <section class="panel" style="padding:24px 16px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center">
    <span class="muted" style="font-size:13px">聽聽看，你聽到的是哪一個？</span>
    <div class="row" style="justify-content:center"><button class="say" data-replay style="width:72px;height:72px" aria-label="再聽一次">${IC.spk.replace('<svg ','<svg style="width:34px;height:34px" ')}</button>
    <button class="chipbtn" data-slow>慢速再聽</button></div></section>
  <div class="opts">${opts.map(o=>`<button class="opt popt" data-o="${o}"><span>${esc(pwLabel(o))}</span><span class="kk">[${PW[o]}]</span></button>`).join("")}</div>
  <div class="why" id="why" hidden></div><button class="btn pri" id="pnext" hidden>${PQ.i+1<n?"下一題":"看結果"}</button>`;
  app.onclick=e=>{if(e.target.closest("[data-quit]"))return go({name:"plesson",id:l.id});
    if(e.target.closest("[data-replay]"))return speakPW(w);if(e.target.closest("[data-slow]"))return speakPW(w,.55);
    if(e.target.closest("#pnext")){PQ.i++;return render()}
    const o=e.target.closest("[data-o]");if(!o)return;if(PQ.ans===PQ.i)return speakPW(o.dataset.o);PQ.ans=PQ.i;const ok=o.dataset.o===w;if(ok)PQ.ok++;
    app.querySelectorAll("[data-o]").forEach(b=>{if(b.dataset.o===w)b.classList.add("right");else if(b===o)b.classList.add("wrong")});
    const y=document.getElementById("why");y.hidden=false;y.className="why "+(ok?"good":"bad");
    y.innerHTML=`<b>${ok?"答對了！":"你聽到的是 "+esc(pwLabel(w))}</b>${ok?"":"點兩個選項各聽一次，比較它們的差別。"}`;
    document.getElementById("pnext").hidden=false;
    if(!ok)setTimeout(()=>speakPW(w),300)};
  setTimeout(()=>speakPW(w),300)}

// ---------- isolated sound synthesis (formant synthesis via Web Audio) ----------
// Vowel formants: American English adult male averages (Hillenbrand et al., 1995), Hz [F1,F2,F3]
const FMT={i:[342,2322,3000],"ɪ":[427,2034,2684],e:[476,2089,2691],"ɛ":[580,1799,2605],"æ":[588,1952,2601],"ɑ":[768,1333,2522],"ɔ":[652,997,2538],
  o:[497,910,2459],"ʊ":[469,1122,2434],u:[378,997,2343],"ʌ":[623,1200,2550],"ɝ":[474,1379,1710],"ɚ":[474,1379,1710],"ə":[500,1450,2500],
  l:[360,1000,2700],r:[420,1250,1600],w:[300,700,2200],j:[280,2250,2950]};
// adult female averages (Hillenbrand et al., 1995); glides/liquids estimated
const FMTF={i:[437,2761,3372],"ɪ":[483,2365,3053],e:[536,2530,3047],"ɛ":[731,2058,2979],"æ":[669,2349,2972],"ɑ":[936,1551,2815],"ɔ":[781,1136,2824],
  o:[555,1035,2828],"ʊ":[519,1225,2827],u:[459,1105,2735],"ʌ":[753,1426,2933],"ɝ":[523,1588,1929],"ɚ":[523,1588,1929],"ə":[580,1700,2900],
  l:[400,1150,2900],r:[450,1350,1800],w:[330,800,2500],j:[320,2600,3300]};
// synth follows the chosen English voice: male only when that voice is known to be male
function synthMale(){try{const v=enVoice();return !!(v&&MAL.test(v.name)&&!FEM.test(v.name))}catch(e){return false}}
const FM=()=>synthMale()?FMT:FMTF;
const DIPH={"aɪ":["ɑ","ɪ"],"aʊ":["ɑ","ʊ"],"ɔɪ":["ɔ","ɪ"],"ɑr":["ɑ","r"],"ɔr":["ɔ","r"]};
const LONGV=new Set(["i","e","u","o","ɔ","ɝ"]);
const STOPS={p:"puh",b:"buh",t:"tuh",d:"duh",k:"kuh",g:"guh","tʃ":"chuh","dʒ":"juh"};
const FRIC={s:[6500,1.2,.55,0],z:[6500,1.2,.45,1],"ʃ":[2700,1.8,.6,0],"ʒ":[2700,1.8,.5,1],f:[5000,.4,.22,0],v:[5000,.4,.18,1],"θ":[6000,.3,.14,0],"ð":[6000,.3,.12,1]};
const NASAL={m:[250,1000],n:[250,1600],"ŋ":[250,2100]};
let AC=null,MASTER=null,NOISE=null,WAVE=null;
function ac(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();
    const comp=AC.createDynamicsCompressor();MASTER=AC.createGain();MASTER.gain.value=2.2;MASTER.connect(comp);comp.connect(AC.destination);
    const n=AC.sampleRate,buf=AC.createBuffer(1,n,n),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;NOISE=buf;
    const H=48,re=new Float32Array(H),im=new Float32Array(H);for(let k=1;k<H;k++)im[k]=1/Math.pow(k,1.1);WAVE=AC.createPeriodicWave(re,im)}
  if(AC.state==="suspended")AC.resume();return AC}catch(e){return null}}
function envGain(t0,dur,amp,att){const g=AC.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(amp,t0+(att||.04));
  g.gain.setValueAtTime(amp,t0+Math.max(.05,dur-.09));g.gain.linearRampToValueAtTime(0,t0+dur);return g}
function buzz(t0,dur){const o=AC.createOscillator();o.setPeriodicWave(WAVE);const m=synthMale();o.frequency.setValueAtTime(m?122:215,t0);o.frequency.linearRampToValueAtTime(m?104:190,t0+dur);o.start(t0);o.stop(t0+dur+.05);return o}
function voiced(t0,dur,from,to,amp){const src=buzz(t0,dur),env=envGain(t0,dur,amp||1);
  (synthMale()?[[0,85,1],[1,110,.75],[2,170,.4]]:[[0,110,1],[1,140,.8],[2,190,.45]]).forEach(([k,bw,gv])=>{const f=AC.createBiquadFilter();f.type="bandpass";f.Q.value=from[k]/bw;
    f.frequency.setValueAtTime(from[k],t0+.03);f.frequency.linearRampToValueAtTime(to[k],t0+dur*.85);
    const g=AC.createGain();g.gain.value=gv;src.connect(f);f.connect(g);g.connect(env)});env.connect(MASTER)}
function noise(t0,dur,fc,q,amp){const s=AC.createBufferSource();s.buffer=NOISE;const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=fc;f.Q.value=q;
  const env=envGain(t0,dur,amp,.06);s.connect(f);f.connect(env);env.connect(MASTER);s.start(t0);s.stop(t0+dur+.05)}
function lowBuzz(t0,dur,amp,f2){const src=buzz(t0,dur),env=envGain(t0,dur,amp);const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=320;src.connect(lp);lp.connect(env);
  if(f2){const bp=AC.createBiquadFilter();bp.type="bandpass";bp.frequency.value=f2;bp.Q.value=8;const g=AC.createGain();g.gain.value=.12;src.connect(bp);bp.connect(g);g.connect(env)}
  env.connect(MASTER)}
// split a KK string like "aɪ", "tʃ", "kw", "ɑr" into sounds
function phTokens(str){const out=[];let s=str.replace(/[ˋˏ\s\/]/g,"");
  while(s.length){const two=s.slice(0,2);if(DIPH[two]||STOPS[two]){out.push(two);s=s.slice(2);continue}out.push(s[0]);s=s.slice(1)}return out}
// schedule one sound at time t; returns its duration in seconds, or a TTS fallback string
function playSound(ph,t){const T=FM();
  if(DIPH[ph]){const [a,b]=DIPH[ph];voiced(t,.6,T[a],T[b]);return .6}
  if(T[ph]&&!"lrwj".includes(ph)){const d=LONGV.has(ph)?.62:(ph==="ə"||ph==="ɚ")?.32:.42;voiced(t,d,T[ph],T[ph]);return d}
  if(ph==="w"||ph==="j"){voiced(t,.42,T[ph],T["ə"]);return .42}
  if(ph==="l"||ph==="r"){voiced(t,.5,T[ph],T[ph],.9);return .5}
  if(NASAL[ph]){lowBuzz(t,.5,.8,NASAL[ph][1]);return .5}
  if(FRIC[ph]){const [fc,q,a,vz]=FRIC[ph];noise(t,.5,fc,q,a*2.4);if(vz)lowBuzz(t,.5,.5);return .5}
  if(ph==="h"){noise(t,.35,1500,.6,.6);return .35}
  return null}
// play a sequence of sounds (synth where possible, TTS sound-spelling for stops)
async function playPhonemes(str,tok){const groups=str.split("/").map(g=>g.trim()).filter(Boolean);if(!groups.length)return false;
  for(let gi=0;gi<groups.length;gi++){if(gi)await wait(450);if(tok!==RL)return true;await playGroup(groups[gi],tok)}return true}
async function playGroup(str,tok){const toks=phTokens(str);
  for(const ph of toks){if(tok!==RL)return true;
    if(STOPS[ph]){await say(STOPS[ph],"en-US",.8);await wait(120);continue}
    const ctx=ac();if(!ctx){continue}const d=playSound(ph,ctx.currentTime+.03);if(d==null)continue;await wait(d*1000+140)}
  return true}
// which sound does a lesson item teach? "ɪ", "p / b", or the first [..] in its tip
function itemSound(l,it){const s=it.s.trim();
  if(l.track==="kk"&&!/[\u4e00-\u9fff]/.test(s))return s;
  const m=(s+" "+it.tip).match(/\[([^\]]+)\]/);return m?m[1]:""}

// ---------- spelling ----------
const canSpell=en=>/^[A-Za-z][A-Za-z'\-]*$/.test(en)&&en.replace(/[^A-Za-z]/g,"").length<=14;
const spellText=en=>en.toUpperCase().replace(/[^A-Z]/g,"").split("").join(", ");
async function spellOut(en){const tok=++RL;try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel()}catch(e){}
  await say(en,"en-US",.85);if(tok!==RL)return;await wait(300);await say(spellText(en),"en-US",.6);if(tok!==RL)return;await wait(300);await say(en,"en-US",.85)}
render();
</script>
