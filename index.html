.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wide{grid-column:1/-1}

.card-stage{perspective:1000px}
.flash{position:relative;height:300px;transform-style:preserve-3d;transition:transform .45s}

.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;background:var(--surface);border:1px solid var(--line);border-bottom-width:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}

.big{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.1;word-break:break-word}
.pos{font-size:13px;color:var(--plum);font-weight:700}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-bottom-width:4px;font-weight:700}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:13px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}

.tab.on{color:var(--accent)}
.lvwrap{display:flex;flex-direction:column;gap:8px}

.lvb b{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.2}
.lvb span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lvb.on{background:var(--accent);border-color:var(--accent);color:#fff}.lvb.on span{color:#fff;opacity:.9}
.lvfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.newc{background:var(--accent-soft);color:var(--accent)}
.daily{display:flex;flex-direction:column;gap:12px}
.ngl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:700}

.glist{display:flex;flex-direction:column;gap:10px}

.ftable{display:flex;flex-direction:column;gap:6px}

.qtext{font-size:20px;font-weight:700;line-height:1.5}

.pres{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:2.4em 1fr 2.5em;gap:10px;align-items:center;font-variant-numeric:tabular-nums}

.chat{display:flex;flex-direction:column;gap:10px}

.qtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:8px}
.chipbtn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}

.inl.sm{font-size:13px;color:var(--muted)}.inl.sm input{width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}

.empty{text-align:center;color:var(--muted);padding:20px 0}
.del{color:var(--bad);font-size:13px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

// ---------- state ----------
const KEY="vocab-planet-v1";
let S={prog:{},days:[],custom:[]};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function markToday(){const t=todayStr();if(!S.days.includes(t)){S.days.push(t);save()}renderStreak()}
function streak(){let n=0;const d=new Date();if(!S.days.includes(todayStr()))d.setDate(d.getDate()-1);
  for(;;){const s=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(S.days.includes(s)){n++;d.setDate(d.getDate()-1)}else break}return n}
function renderStreak(){document.getElementById("streakN").textContent=streak()}

function allSets(){
  const sets=BUILTIN.map(s=>({...s,level:s.level||"A1",words:s.words.map(w=>({en:w[0],pos:w[1],zh:w[2],ex:w[3],id:s.id+":"+w[0]}))}));
  sets.push({id:"custom",name:"我的單字",tag:"自訂",level:"自訂",words:S.custom.map(w=>({...w,id:"custom:"+w.en}))});
  return sets}
const getSet=id=>allSets().find(s=>s.id===id);
const LEVELS=["A1","A2","B1","B2","C1","C2"];
const LVINFO={A1:["英檢入門","國小","最基本的字：數字、顏色、家人、打招呼。"],A2:["英檢初級","國中・會考","日常簡單對話：購物、問路、點餐、看病。"],
  B1:["英檢中級","高中・學測","旅行、工作、學習的一般情境都能應付。"],B2:["英檢中高級","大學・多益","讀新聞、開會、寫商務信，用片語自然表達。"],
  C1:["英檢高級","職場專業","金融、法律、醫療、管理等專業場合用字。"],C2:["英檢優級","精通","接近母語人士的精準用字和道地慣用語。"]};
if(!LEVELS.includes(S.level)&&S.level!=="全部")S.level="A1";
const lvSets=()=>allSets().filter(s=>S.level==="全部"||s.level===S.level||s.id==="custom");
const lvName=()=>S.level==="全部"?"全部":S.level;
function lvBar(){const sets=allSets(),cnt=l=>sets.filter(s=>s.id!=="custom"&&(l==="全部"||s.level===l)).reduce((a,s)=>a+s.words.length,0);
  return `<div class="lvwrap"><div class="lvbar">${LEVELS.map(l=>`<button class="lvb ${S.level===l?"on":""}" data-lv="${l}" aria-pressed="${S.level===l}"><b>${l}</b><span>${LVINFO[l][0]}</span><span>${LVINFO[l][1]}・${cnt(l)}字</span></button>`).join("")}</div>
  <div class="lvfoot"><span class="muted">${S.level==="全部"?"顯示所有程度的單字。":LVINFO[S.level][2]}</span><button class="fchip ${S.level==="全部"?"on":""}" data-lv="全部">全部程度・${cnt("全部")}字</button></div></div>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-lv]");if(!b)return;S.level=b.dataset.lv;setTag="全部";save();render()});
// spaced repetition: box 0-7, next review after IV[box] days
const IV=[0,1,2,4,7,15,30,60];
const dayStr=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return dayStr(d)};
if(!S.srs){S.srs={};for(const k in (S.prog||{})){const p=S.prog[k];if(p>0)S.srs[k]={b:p>=3?4:p,d:todayStr()}}}
if(!S.gram)S.gram={};
const box=w=>(S.srs[w.id]||{}).b||0;
const seen=w=>!!S.srs[w.id];
const isDue=w=>!!S.srs[w.id]&&S.srs[w.id].d<=todayStr();
const lv=w=>{const b=box(w);return b>=5?3:b>=3?2:b>=1?1:0};
const mastered=ws=>ws.filter(w=>box(w)>=4).length;
function dayState(){if(!S.day||S.day.d!==todayStr())S.day={d:todayStr(),newN:0,revN:0,gram:0,talk:0};return S.day}
function bump(w,ok){const ds=dayState(),r=S.srs[w.id],due=!r||r.d<=todayStr();
  if(!r)ds.newN++;else if(due)ds.revN++;
  let b=r?r.b:0;
  if(ok){if(due)b=Math.min(IV.length-1,b+1)}else b=Math.max(0,b-2);
  S.srs[w.id]={b,d:ok?addDays(IV[b]):addDays(b?1:0)};save()}

// ---------- speech ----------
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;const vv=enVoice();if(vv)u.voice=vv;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast("此瀏覽器不支援發音")}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1600)}

// ---------- router ----------
const app=document.getElementById("app");
let view={name:"home"};
function go(v){if(D)stopDrive();if(P)stopP();view=v;render();window.scrollTo(0,0)}
const TABS=[["home","首頁","home"],["sets","單字","book"],["grammar","文法","pen"],["talk","對話","chat"],["listen","聽力","ear"]];
function renderTabs(){
  const cur={set:"sets",flash:"sets",quiz:"sets",done:"sets",words:"sets",add:"sets",drive:"listen",lesson:"grammar",dialog:"talk",placement:"home"}[view.name]||view.name;
  document.getElementById("tabs").innerHTML=TABS.map(([k,l,i])=>`<button class="tab ${cur===k?"on":""}" data-tab="${k}">${IC[i]}${l}</button>`).join("");
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;
  const k=b.dataset.tab;go({name:k==="listen"?"drive":k})});

function render(){renderTabs();renderStreak();(V[view.name]||V.home)()}
const V={};

V.home=()=>{
  const sets=lvSets(),all=sets.flatMap(s=>s.words),m=mastered(all),pct=all.length?Math.round(m/all.length*100):0;

  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const s=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    days.push(`<div class="day ${S.days.includes(s)?"on":""} ${i===0?"today":""}"><i>${S.days.includes(s)?"🔥":""}</i><span>週${lbl[d.getDay()]}</span></div>`)}
  app.innerHTML=`${dailyPanel()}<a class="ptip" href="pronounce.html" style="text-decoration:none">${IC.target}<span>發音評分：念念看，系統會幫你打分數</span><b>›</b></a>
  <section style="display:flex;flex-direction:column;gap:8px"><div class="row"><h2>選擇程度</h2><span class="muted" style="font-size:13px">測驗、翻卡、開車聽學都會跟著這個程度</span></div>${lvBar()}</section>
  <section class="panel">
    <div class="stats">
      <div class="stat"><b style="color:var(--accent)">${all.length}</b><span>${lvName()}單字</span></div>
      <div class="stat"><b style="color:var(--good)">${m}</b><span>已精通</span></div>
      <div class="stat"><b style="color:var(--plum)">${pct}%</b><span>進度</span></div>
    </div>
    <div class="row" style="margin-top:16px"><h2>連續學習 ${streak()} 天</h2><span class="muted" style="font-size:13px">每天練一次就會點亮</span></div>
    <div class="week">${days.join("")}</div>
  </section>
  <section style="display:flex;flex-direction:column;gap:10px">
    <h2>快速開始</h2>
    <div class="quick">
      <button class="qbtn" data-q="placement"><span class="ic c-blue">${IC.target}</span>程度測驗</button>
      <button class="qbtn" data-q="quiz"><span class="ic c-plum">${IC.bolt}</span>隨機測驗</button>
      <button class="qbtn" data-q="flash"><span class="ic c-sun">${IC.cards}</span>翻卡複習</button>
      <button class="qbtn" data-q="listen"><span class="ic c-good">${IC.ear}</span>聽寫練習</button>
      <button class="qbtn wide" data-q="drive"><span class="ic c-blue">${IC.car}</span>開車聽學・免看螢幕自動播放</button>
    </div>
  </section>
  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="row"><h2>單字集</h2><button class="back" data-q="sets" style="color:var(--accent)">全部 ›</button></div>
    ${setCards(sets.slice(0,2))}
  </section>`;
  app.onclick=e=>{const q=e.target.closest("[data-q]");if(q){const k=q.dataset.q;
      if(k==="daily")startDaily();else if(k==="placement"){PT=null;go({name:"placement"})}else if(k==="quiz")startQuiz("all");else if(k==="flash")startFlash("all");else if(k==="listen")startListen("all");else go({name:k});return}
    const s=e.target.closest("[data-set]");if(s)go({name:"set",id:s.dataset.set})};
};

function setCards(sets){return `<div class="sets">${sets.map(s=>{const m=mastered(s.words),p=s.words.length?m/s.words.length*100:0;
  return `<button class="set" data-set="${s.id}"><div class="row"><h3>${esc(s.name)}</h3><span class="chip">${S.level==="全部"&&s.id!=="custom"?esc(s.level)+"・":""}${esc(s.tag)}</span></div>
  <span class="muted" style="font-size:13px">${s.words.length} 個單字・已學會 ${m}/${s.words.length}</span><div class="bar"><div style="width:${p}%"></div></div></button>`}).join("")}</div>`}

let setTag="全部";
V.sets=()=>{const sets=lvSets(),ORD=["基礎","生活","學校","描述","動詞","健康","旅行","職場","商務","社會","觀念","科技","金融","法律","片語","短句","自訂"],tags=["全部",...[...new Set(sets.map(s=>s.tag))].sort((x,y)=>(ORD.indexOf(x)+99)%99-(ORD.indexOf(y)+99)%99)];
  sets.sort((x,y)=>ORD.indexOf(x.tag)-ORD.indexOf(y.tag));
  const shown=setTag==="全部"?sets:sets.filter(s=>s.tag===setTag);
  const total=shown.reduce((a,s)=>a+s.words.length,0);
  app.innerHTML=`<div class="row"><h2>單字集</h2><span class="muted" style="font-size:13px">${shown.length} 組・${total} 個</span></div>
  <div class="quick"><button class="qbtn" data-go="words"><span class="ic c-plum">${IC.grid}</span>搜尋單字</button><button class="qbtn" data-go="add"><span class="ic c-blue">${IC.plus}</span>新增單字</button></div>
  ${lvBar()}<div class="chips">${tags.map(t=>`<button class="fchip ${t===setTag?"on":""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}</div>${setCards(shown)}`;
  app.onclick=e=>{const gg=e.target.closest("[data-go]");if(gg)return go({name:gg.dataset.go});const t=e.target.closest("[data-tag]");if(t){setTag=t.dataset.tag;return render()}
    const s=e.target.closest("[data-set]");if(s)go({name:"set",id:s.dataset.set})}};

function wordRows(ws,del){return ws.length?`<div class="wlist">${ws.map(w=>`<div class="witem">
  <button class="say" data-say="${esc(w.en)}" aria-label="發音 ${esc(w.en)}">${IC.spk}</button>
  <div style="min-width:0"><div class="en">${esc(w.en)} <span class="pos">${esc(w.pos||"")}</span></div><div class="zh">${esc(w.zh)}</div></div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><div class="lv" title="熟練度">${[0,1,2].map(i=>`<i class="${lv(w)>i?"f":""}"></i>`).join("")}</div>
  ${del?`<button class="del" data-del="${esc(w.en)}">刪除</button>`:""}</div></div>`).join("")}</div>`:`<p class="empty">還沒有單字，到「新增」加入第一個吧。</p>`}

V.set=()=>{const s=getSet(view.id),m=mastered(s.words),p=s.words.length?Math.round(m/s.words.length*100):0,has=s.words.length>0;
  app.innerHTML=`<button class="back" data-back>${IC.left}單字集</button>
  <section class="panel" style="display:flex;flex-direction:column;gap:12px">
    <div class="row"><h2 style="font-size:22px">${esc(s.name)}</h2><span class="chip">${s.id==="custom"?"自訂":esc(s.level)+"・"+esc(s.tag)}</span></div>
    <div class="row muted" style="font-size:13px"><span>${s.words.length} 個單字</span><span style="color:var(--good);font-weight:700">已學會 ${m}/${s.words.length}（${p}%）</span></div>
    <div class="bar"><div style="width:${p}%"></div></div>
    <div class="modes">
      <button class="mode c-sun" data-m="flash" ${has?"":"disabled"}>${IC.cards}翻卡</button>
      <button class="mode c-plum" data-m="quiz" ${s.words.length>=4?"":"disabled"}>${IC.bolt}測驗</button>
      <button class="mode c-good" data-m="listen" ${has?"":"disabled"}>${IC.ear}聽寫</button>
      <button class="mode c-blue" data-m="drive" ${has?"":"disabled"}>${IC.car}開車聽</button>
    </div>
    ${s.id==="custom"&&s.words.length<4?'<p class="muted" style="font-size:13px;margin:0">測驗需要至少 4 個單字。</p>':""}
  </section>
  <section class="panel">${wordRows(s.words,s.id==="custom")}</section>`;
  app.onclick=e=>{if(e.target.closest("[data-back]"))return go({name:"sets"});
    const sy=e.target.closest("[data-say]");if(sy)return speak(sy.dataset.say);
    const d=e.target.closest("[data-del]");if(d){S.custom=S.custom.filter(w=>w.en!==d.dataset.del);save();return render()}
    const md=e.target.closest("[data-m]");if(md&&!md.disabled){const k=md.dataset.m;k==="drive"?go({name:"drive",set:s.id}):k==="flash"?startFlash(s.id):k==="quiz"?startQuiz(s.id):startListen(s.id)}}};

V.words=()=>{const ws=lvSets().flatMap(s=>s.words);
  app.innerHTML=`<div class="row"><h2>單字</h2><span class="muted" style="font-size:13px">${ws.length} 個</span></div>${lvBar()}<input id="q" type="search" placeholder="搜尋英文或中文…"><section class="panel" id="wl">${wordRows(ws)}</section>`;
  const q=document.getElementById("q");q.oninput=()=>{const t=q.value.trim().toLowerCase();
    document.getElementById("wl").innerHTML=wordRows(ws.filter(w=>w.en.toLowerCase().includes(t)||w.zh.includes(t)))};
  app.onclick=e=>{const sy=e.target.closest("[data-say]");if(sy)speak(sy.dataset.say)}};

V.add=()=>{app.innerHTML=`<h2>新增單字</h2>
  <form class="panel" id="f" style="display:flex;flex-direction:column;gap:12px">
    <div class="field"><label for="en">英文</label><input id="en" required autocomplete="off" autocapitalize="off" placeholder="例如 weekend"></div>
    <div class="field"><label for="zh">中文意思</label><input id="zh" required autocomplete="off" placeholder="例如 週末"></div>
    <div class="field"><label for="pos">詞性</label><select id="pos"><option>n.</option><option>v.</option><option>adj.</option><option>adv.</option><option>prep.</option><option>phr.</option></select></div>
    <div class="field"><label for="ex">例句（選填）</label><input id="ex" autocomplete="off" placeholder="例如 I play ball on weekends."></div>
    <button class="btn pri" type="submit">加入「我的單字」</button>
  </form>
  <section class="panel"><div class="row" style="margin-bottom:6px"><h2>我的單字</h2><span class="chip">${S.custom.length} 個</span></div>${wordRows(getSet("custom").words,true)}</section>`;
  document.getElementById("f").onsubmit=e=>{e.preventDefault();const en=document.getElementById("en").value.trim(),zh=document.getElementById("zh").value.trim();
    if(!en||!zh)return;if(S.custom.some(w=>w.en.toLowerCase()===en.toLowerCase()))return toast("這個單字已經加過了");
    S.custom.push({en,zh,pos:document.getElementById("pos").value,ex:document.getElementById("ex").value.trim()});save();toast("已加入 "+en);render()};
  app.onclick=e=>{const sy=e.target.closest("[data-say]");if(sy)return speak(sy.dataset.say);
    const d=e.target.closest("[data-del]");if(d){S.custom=S.custom.filter(w=>w.en!==d.dataset.del);save();render()}}};

// ---------- sessions ----------
let run=null;
function pool(id){const ws=(id==="all"?lvSets().flatMap(s=>s.words):getSet(id).words);
  // weaker words first, cap at 10
  return shuffle(ws).sort((a,b)=>lv(a)-lv(b)).slice(0,10)}
function progBar(){return `<div class="prog"><button class="back" data-quit aria-label="結束">✕</button><div class="bar"><div style="width:${run.i/run.list.length*100}%;background:var(--accent)"></div></div><span>${run.i}/${run.list.length}</span></div>`}
function quitBack(){return run.from==="all"||run.from==="daily"?{name:"home"}:{name:"set",id:run.from}}

function startFlash(id){const l=pool(id);if(!l.length)return toast("這組還沒有單字");run={kind:"flash",from:id,list:l,i:0,ok:0};go({name:"flash"})}
V.flash=()=>{if(run.i>=run.list.length)return finish();const w=run.list[run.i];
  app.innerHTML=`${progBar()}
  <div class="card-stage"><div class="flash" id="fc" role="button" tabindex="0" aria-label="點一下翻面">
    <div class="face">${seen(w)?(isDue(w)?'<span class="chip">複習</span>':""):'<span class="chip newc">新字</span>'}<div class="big">${esc(w.en)}</div><div class="pos">${esc(w.pos||"")}</div><button class="say" data-say="${esc(w.en)}">${IC.spk}</button><span class="muted" style="font-size:13px">點卡片看答案</span></div>
    <div class="face b"><div class="big" style="font-family:var(--body);font-size:32px">${esc(w.zh)}</div><div style="font-family:var(--display);font-weight:600">${esc(w.en)}</div>${w.ex?`<div class="ex">${esc(w.ex)}</div>`:""}</div>
  </div></div>
  <div class="btns"><button class="btn no" data-r="0">還不熟</button><button class="btn ok" data-r="1">記得了</button></div>`;
  const fc=document.getElementById("fc");fc.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();fc.classList.toggle("flip")}};
  app.onclick=e=>{if(e.target.closest("[data-quit]"))return go(quitBack());
    const sy=e.target.closest("[data-say]");if(sy){e.stopPropagation();return speak(sy.dataset.say)}
    if(e.target.closest("#fc"))return fc.classList.toggle("flip");
    const r=e.target.closest("[data-r]");if(r){const ok=r.dataset.r==="1";bump(w,ok);if(ok)run.ok++;run.i++;render()}};
  speak(w.en)};

function startQuiz(id){const l=pool(id);const all=(id==="all"?lvSets():allSets()).flatMap(s=>s.words);if(all.length<4)return toast("單字不夠");run={kind:"quiz",from:id,list:l,i:0,ok:0,all};go({name:"quiz"})}
V.quiz=()=>{if(run.i>=run.list.length)return finish();const w=run.list[run.i];
  const enToZh=Math.random()<.5;
  const others=shuffle(run.all.filter(x=>x.id!==w.id&&x.zh!==w.zh)).slice(0,3);
  const opts=shuffle([w,...others]);
  app.innerHTML=`${progBar()}
  <section class="panel" style="text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:28px 16px">
    <span class="muted" style="font-size:13px">${enToZh?"選出正確的中文意思":"選出正確的英文單字"}</span>
    <div class="big" style="${enToZh?"":"font-family:var(--body);font-size:32px"}">${esc(enToZh?w.en:w.zh)}</div>
    ${qtools(enToZh?w.en:w.zh,opts.map(o=>enToZh?o.zh:o.en))}
  </section>
  <div class="opts">${opts.map(o=>`<button class="opt" data-o="${esc(o.id)}">${esc(enToZh?o.zh:o.en)}</button>`).join("")}</div>
  <div class="fb" id="fb"></div>`;
  let answered=false;
  app.onclick=e=>{if(e.target.closest("[data-quit]"))return go(quitBack());
    const sy=e.target.closest("[data-say]");if(sy)return speak(sy.dataset.say);
    const o=e.target.closest("[data-o]");if(!o||answered)return;answered=true;
    const ok=o.dataset.o===w.id;bump(w,ok);if(ok)run.ok++;
    app.querySelectorAll("[data-o]").forEach(b=>{if(b.dataset.o===w.id)b.classList.add("right");else if(b===o)b.classList.add("wrong")});
    const fb=document.getElementById("fb");fb.className="fb "+(ok?"good":"bad");fb.textContent=ok?"答對了！":`正確答案：${w.en} ＝ ${w.zh}`;
    speak(w.en);setTimeout(()=>{run.i++;render()},ok?900:1800)};
  if(S.autoRead!==false)setTimeout(()=>readQ(enToZh?w.en:w.zh),250)};

function startListen(id){const l=pool(id).filter(w=>!/[ ?!.]/.test(w.en));if(!l.length)return toast("這組是短句，請用翻卡或測驗練習");run={kind:"listen",from:id,list:l,i:0,ok:0};go({name:"listen"})}
V.listen=()=>{if(!run||run.kind!=="listen")return startListen("all");if(run.i>=run.list.length)return finish();const w=run.list[run.i];
  app.innerHTML=`${progBar()}
  <section class="panel" style="text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:28px 16px">
    <span class="muted" style="font-size:13px">聽發音，拼出英文單字</span>
    <button class="say" data-say="${esc(w.en)}" style="width:76px;height:76px" aria-label="再聽一次">${IC.spk.replace('<svg ','<svg style="width:36px;height:36px" ')}</button>
    <span class="muted" style="font-size:13px">提示：${esc(w.zh)}（${w.en.length} 個字母）</span>
  </section>
  <form id="lf" style="display:flex;flex-direction:column;gap:10px">
    <input id="sp" class="spell" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="輸入你聽到的單字">
    <div class="fb" id="fb"></div>
    <div class="btns"><button type="button" class="btn ghost" data-skip>不會，跳過</button><button class="btn pri" type="submit">確認</button></div>
  </form>`;
  let answered=false;
  const next=(ok)=>{if(answered)return;answered=true;bump(w,ok);if(ok)run.ok++;
    const fb=document.getElementById("fb");fb.className="fb "+(ok?"good":"bad");fb.textContent=ok?"拼對了！":`正確拼法：${w.en}`;
    setTimeout(()=>{run.i++;render()},ok?900:1800)};
  document.getElementById("lf").onsubmit=e=>{e.preventDefault();const v=document.getElementById("sp").value.trim().toLowerCase();if(!v)return;next(v===w.en.toLowerCase())};
  app.onclick=e=>{if(e.target.closest("[data-quit]"))return go(quitBack());
    if(e.target.closest("[data-skip]"))return next(false);
    const sy=e.target.closest("[data-say]");if(sy)speak(sy.dataset.say)};
  setTimeout(()=>speak(w.en),250)};

function finish(){markToday();const n=run.list.length,ok=run.ok;
  app.innerHTML=`<section class="panel done" style="padding:32px 16px">
    <span style="font-size:46px" aria-hidden="true">${ok/n>=.8?"🎉":ok/n>=.5?"👍":"💪"}</span>
    <div class="big">${ok}/${n}</div>
    <h2>${ok/n>=.8?"太厲害了！":ok/n>=.5?"不錯喔，繼續加油":"多練幾次就會記住"}</h2>
    <p class="muted" style="margin:0">今天的連續天數已點亮，目前 ${streak()} 天 🔥</p>
  </section>
  <div class="btns"><button class="btn ghost" data-home>回去</button><button class="btn pri" data-again>再練一輪</button></div>`;
  view={name:"done"};renderTabs();
  const k=run.kind,from=run.from;
  app.onclick=e=>{if(e.target.closest("[data-home]"))return go(from==="all"||from==="daily"?{name:"home"}:{name:"set",id:from});
    if(e.target.closest("[data-again]"))from==="daily"?startDaily():k==="flash"?startFlash(from):k==="quiz"?startQuiz(from):startListen(from)}}

// ---------- drive mode ----------

pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.5" height="14" rx="1"/><rect x="13.5" y="5" width="4.5" height="14" rx="1"/></svg>',
prev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 6.2v11.6a.8.8 0 0 1-1.2.7L9 13.2v4.3a1 1 0 0 1-2 0v-11a1 1 0 0 1 2 0v4.3l7.8-5.3a.8.8 0 0 1 1.2.7z"/></svg>',

let D=null,wake=null;
const dcfg=()=>Object.assign({set:"all",rand:false,slow:false,rep:true,ex:true,shadow:false},S.drive||{});
async function getWake(){try{wake=await navigator.wakeLock.request("screen")}catch(e){}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
document.addEventListener("visibilitychange",()=>{if(D&&D.playing&&document.visibilityState==="visible")getWake()});
function stopDrive(){if(!D)return;D.tok++;D=null;try{speechSynthesis.cancel()}catch(e){}releaseWake()}
function say(text,lang,rate,voice){return new Promise(res=>{let done=false;const fin=()=>{if(!done){done=true;res()}};
  try{const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;const vv=voice||(/^zh/i.test(lang)?zhVoice():enVoice());if(vv)u.voice=vv;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)}catch(e){fin()}
  setTimeout(fin,2500+text.length*160/rate)})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function setStep(t){const el=document.getElementById("dstep");if(el)el.textContent=t}
async function playLoop(){
  const tok=++D.tok,c=D.cfg,r=c.slow?.7:.95,ok=()=>D&&D.tok===tok&&D.playing;
  try{speechSynthesis.cancel()}catch(e){}
  while(ok()){
    const w=D.list[D.i];render();
    setStep("英文");await say(w.en,"en-US",r);if(!ok())return;await wait(700);if(!ok())return;
    if(c.rep){setStep("再聽一次");await say(w.en,"en-US",Math.max(.7,r*.85));if(!ok())return;await wait(600);if(!ok())return}
    if(c.shadow){setStep("換你跟著念");await wait(1000+w.en.length*90);if(!ok())return}
    setStep("中文");await say(w.zh,"zh-TW",1);if(!ok())return;await wait(700);if(!ok())return;
    if(c.ex&&w.ex){setStep("例句");await say(w.ex,"en-US",r);if(!ok())return;await wait(600);if(!ok())return}
    setStep("");await wait(1300);if(!ok())return;
    D.heard++;if(D.heard===10)markToday();
    D.i++;
    if(D.i>=D.list.length){D.i=0;if(c.rand)D.list=shuffle(D.list);setStep("這一輪聽完了");await say("這一輪聽完了，再從頭開始。","zh-TW",1);if(!ok())return;await wait(800)}
  }}
function driveCtl(a){if(!D)return;const n=D.list.length;
  if(a==="toggle"){D.playing=!D.playing;if(D.playing){getWake();playLoop()}else{D.tok++;try{speechSynthesis.cancel()}catch(e){}render()}return}
  if(a==="next")D.i=(D.i+1)%n;if(a==="prev")D.i=(D.i-1+n)%n;
  if(D.playing)playLoop();else render()}
function driveList(key){const sets=lvSets();
  if(key==="all")return{name:lvName()+"單字",list:sets.flatMap(s=>s.words)};
  if(key.startsWith("tag:")){const t=key.slice(4);return{name:t,list:sets.filter(s=>s.tag===t).flatMap(s=>s.words)}}
  const st=sets.find(s=>s.id===key);return st?{name:st.name,list:st.words}:{name:"全部單字",list:sets.flatMap(s=>s.words)}}
V.drive=()=>{
  if(D){const w=D.list[D.i];
    app.innerHTML=`<section class="drive" aria-live="polite">
      <div class="dtop"><span>${esc(D.name)}</span><span>${D.i+1} / ${D.list.length}</span></div>
      <div style="display:flex;flex-direction:column;gap:10px"><div class="dstep" id="dstep"></div>
        <div class="dword">${esc(w.en)}</div><div class="dzh">${esc(w.zh)}</div><div class="dex">${D.cfg.ex&&w.ex?esc(w.ex):""}</div></div>
      <div class="dctl"><button data-d="prev" aria-label="上一個">${IC.prev}</button>
        <button data-d="toggle" class="dplay" aria-label="${D.playing?"暫停":"播放"}">${D.playing?IC.pause:IC.play}</button>
        <button data-d="next" aria-label="下一個">${IC.next}</button></div>
      <button class="dstop" data-d="stop">結束聽學</button></section>`;
    app.onclick=e=>{const b=e.target.closest("[data-d]");if(!b)return;if(b.dataset.d==="stop"){stopDrive();return render()}driveCtl(b.dataset.d)};
    return}
  const c=dcfg();if(view.set)c.set=view.set;
  const sets=lvSets().filter(s=>s.words.length),tags=[...new Set(sets.map(s=>s.tag))];
  const all=sets.reduce((a,s)=>a+s.words.length,0);
  const opt=(v,l)=>`<option value="${esc(v)}" ${c.set===v?"selected":""}>${esc(l)}</option>`;
  app.innerHTML=`<h2>開車聽學</h2>${lvBar()}
  <p class="muted" style="margin:0">按一次開始就會自動一直播：英文 → 再念一次 → 中文 → 例句，接著下一個字。適合開車、通勤、做家事時聽。</p>
  <section class="panel" style="display:flex;flex-direction:column;gap:4px">
    <div class="field" style="padding-bottom:10px"><label for="dset">要聽哪些單字</label>
      <select id="dset">${opt("all",`${S.level==="全部"?"全部":"全部"+S.level}（${all} 個）`)}
      ${tags.map(t=>`<optgroup label="${esc(t)}">${opt("tag:"+t,`整個「${t}」（${sets.filter(s=>s.tag===t).reduce((a,s)=>a+s.words.length,0)} 個）`)}${sets.filter(s=>s.tag===t).map(s=>opt(s.id,`${s.name}（${s.words.length}）`)).join("")}</optgroup>`).join("")}</select></div>
    <label class="tgl" for="drep">英文念兩次<input type="checkbox" id="drep" ${c.rep?"checked":""}></label>
    <label class="tgl" for="dex">念例句<input type="checkbox" id="dex" ${c.ex?"checked":""}></label>
    <label class="tgl" for="dslow">放慢語速<input type="checkbox" id="dslow" ${c.slow?"checked":""}></label>
    <label class="tgl" for="drand">隨機順序<input type="checkbox" id="drand" ${c.rand?"checked":""}></label>
    <label class="tgl" for="dsh">跟讀停頓（念完英文留時間讓你跟著說）<input type="checkbox" id="dsh" ${c.shadow?"checked":""}></label>
    <button class="btn pri" id="dgo" style="margin-top:8px;font-size:18px;padding:16px">開始播放</button>
  </section>
  ${voicePicker()}
  <p class="note">請在出發前設定好並按下開始，行駛中不要操作手機。播放時要停留在這個頁面，螢幕會自動保持亮著；切到別的 App 或鎖定螢幕，聲音可能會停。</p>
  <button class="btn ghost" data-dict>改做聽寫練習（要打字，別在開車時用）</button>`;
  app.onclick=e=>{
    if(e.target.closest("[data-dict]"))return startListen(view.set||"all");
    if(!e.target.closest("#dgo"))return;
    const cfg={set:document.getElementById("dset").value,rep:document.getElementById("drep").checked,ex:document.getElementById("dex").checked,
      slow:document.getElementById("dslow").checked,rand:document.getElementById("drand").checked,shadow:document.getElementById("dsh").checked};
    S.drive=cfg;save();const {name,list}=driveList(cfg.set);if(!list.length)return toast("這個範圍沒有單字");
    D={cfg,name,list:cfg.rand?shuffle(list):list.slice(),i:0,tok:0,playing:true,heard:0};
    getWake();window.scrollTo(0,0);playLoop()}};

 q:[["This song ___ by a famous singer.",["wrote","was written","is writing"],1,"歌是被寫的，用被動 was written。"],["Rice ___ in Taiwan.",["grows","is grown","grown"],1,"稻米是被種植的，現在被動 is grown。"],["The meeting ___ canceled yesterday.",["is","was","were"],1,"yesterday 是過去，meeting 單數用 was。"],["The letters ___ sent tomorrow.",["will be","will","were"],0,"未來被動 will be + p.p.。"]]},
{id:"g_relative",level:"B1",title:"關係代名詞 who / which / that",sum:"用一個子句補充說明前面的人或東西。",
 pts:["指人用 who；指東西用 which；兩者都可以用 that。","表示「某人的」用 whose。","關係代名詞當受詞時常可省略：The book (that) I bought…"],
 f:[["人","名詞 + who / that + 子句"],["物","名詞 + which / that + 子句"],["所有","名詞 + whose + 名詞 + …"]],
 ex:[["The man who lives next door is a doctor.","住隔壁的那個男人是醫生。"],["This is the book which I bought yesterday.","這是我昨天買的書。"],["I have a friend whose father is a pilot.","我有個朋友的爸爸是機師。"],["The phone that I lost was new.","我弄丟的那支手機是新的。"]],
 q:[["The girl ___ is singing is my sister.",["who","which","what"],0,"指人用 who。"],["I like the cake ___ my mom made.",["who","which","where"],1,"指東西用 which。"],["Do you know the man ___ car is red?",["who","whose","which"],1,"「他的」車，用 whose。"],["A dictionary is a book ___ explains words.",["who","that","what"],1,"指東西可以用 that。"]]},
{id:"g_if",level:"B1",title:"條件句（第一類、第二類）",sum:"「如果…就…」：可能發生的事 vs. 不太可能的事。",
 pts:["第一類：真的可能發生。If + 現在式，主要子句用 will + 原形。","第二類：與現在事實相反或不太可能。If + 過去式，主要子句用 would + 原形。","第二類的 be 動詞通常一律用 were：If I were you…"],
 f:[["第一類","If + 現在式, 主詞 + will + 原形"],["第二類","If + 過去式, 主詞 + would + 原形"]],
 ex:[["If it rains tomorrow, we will stay home.","如果明天下雨，我們就待在家。"],["If you study hard, you will pass.","如果你用功，你就會及格。"],["If I had more money, I would buy a car.","如果我有更多錢，我會買車。（但我沒有）"],["If I were you, I would take the job.","如果我是你，我會接下這份工作。"]],
 q:[["If it ___ sunny tomorrow, we'll go to the beach.",["is","will be","was"],0,"第一類條件句，if 子句用現在式。"],["If I ___ a bird, I would fly to you.",["am","were","will be"],1,"與事實相反，用 were。"],["If he ___ harder, he would get better grades.",["studies","studied","will study"],1,"主要子句是 would，if 子句用過去式。"],["If you don't hurry, you ___ miss the bus.",["will","would","are"],0,"真的可能發生，用 will。"]]},
{id:"g_gerund",level:"B1",title:"動名詞與不定詞",sum:"動詞後面該接 V-ing 還是 to V？",
 pts:["接 V-ing 的動詞：enjoy、finish、mind、avoid、keep、practice。","接 to V 的動詞：want、decide、hope、plan、need、learn。","like、love、start、begin 兩種都可以。","介系詞（for、at、about、of）後面一定接 V-ing。"],
 f:[["V-ing","enjoy / finish / mind / avoid + V-ing"],["to V","want / decide / hope / plan + to V"],["介系詞","介系詞 + V-ing"]],
 ex:[["I enjoy listening to music.","我喜歡聽音樂。"],["She decided to learn English.","她決定學英文。"],["He is good at cooking.","他很會做菜。"],["Would you mind closing the window?","你介意關一下窗戶嗎？"]],
 q:[["I finished ___ my homework.",["do","to do","doing"],2,"finish 後面接 V-ing。"],["We hope ___ you again.",["see","to see","seeing"],1,"hope 後面接 to V。"],["Thank you for ___ me.",["help","to help","helping"],2,"介系詞 for 後面接 V-ing。"],["He wants ___ a doctor.",["be","to be","being"],1,"want 後面接 to V。"]]},

{id:"g_pastperfect",level:"B2",title:"過去完成式",sum:"說「過去某個時間點之前」就已經發生的事。",
 pts:["結構：had + 過去分詞，所有主詞都一樣。","兩件過去的事，先發生的用過去完成式，後發生的用過去式。","常搭配 by the time、before、after、already、never。"],
 f:[["結構","主詞 + had + p.p."],["搭配","When / By the time + 過去式, 主詞 + had + p.p."]],
 ex:[["When I arrived, the movie had already started.","我到的時候，電影已經開始了。"],["She had never seen the sea before she was 20.","她 20 歲以前從沒看過海。"],["I realized I had left my keys at home.","我發現我把鑰匙忘在家裡了。"],["They had finished dinner when we got there.","我們到的時候，他們已經吃完晚餐了。"]],
 q:[["By the time we got to the station, the train ___.",["left","had left","has left"],1,"火車在我們到之前就開走了，用過去完成式。"],["I ___ never flown before that trip.",["have","had","was"],1,"「那次旅行之前」是過去的過去，用 had。"],["He was tired because he ___ all day.",["had worked","has worked","works"],0,"累之前一整天都在工作，先發生的用 had + p.p.。"],["After she ___ her homework, she went out.",["had finished","has finished","finish"],0,"先寫完功課才出門，先發生的用過去完成式。"]]},
{id:"g_reported",level:"B2",title:"間接引述",sum:"轉述別人說過的話。",
 pts:["說話動詞是過去式（said、told）時，原句時態往前推一格：現在→過去，will→would，can→could。","代名詞和時間詞也要跟著改：I→he/she，tomorrow→the next day。","轉述問句時改成直述句的語序：He asked where I lived.（不是 where did I live）"],
 f:[["直述","He said, \"I am tired.\""],["轉述","He said (that) he was tired."],["問句","She asked (me) + 疑問詞 + 主詞 + 動詞"]],
 ex:[["He said he was tired.","他說他很累。"],["She said she would call me.","她說她會打給我。"],["He asked me where I lived.","他問我住在哪裡。"],["She told me she couldn't come.","她跟我說她不能來。"]],
 q:[["She said, \"I like coffee.\" → She said she ___ coffee.",["likes","liked","has liked"],1,"現在式往前推成過去式。"],["He said, \"I will help you.\" → He said he ___ help me.",["will","would","can"],1,"will 變成 would。"],["\"Where do you work?\" → She asked me where I ___.",["work","worked","did work"],1,"時態往前推，而且改成直述語序。"],["\"I can swim.\" → He said he ___ swim.",["can","could","could to"],1,"can 變成 could。"]]},
{id:"g_third",level:"B2",title:"第三類條件句與 wish",sum:"「要是當初…就好了」：和過去事實相反。",
 pts:["第三類條件句：If + had p.p.，主要子句用 would have + p.p.，表示過去沒發生的事。","I wish + 過去式：希望現在不是這樣。","I wish + had p.p.：後悔過去的事。"],
 f:[["第三類","If + had p.p., 主詞 + would have + p.p."],["wish（現在）","I wish + 主詞 + 過去式 / were"],["wish（過去）","I wish + 主詞 + had p.p."]],
 ex:[["If I had left earlier, I wouldn't have missed the bus.","要是我早點出門，就不會錯過公車了。"],["If she had studied, she would have passed.","要是她有讀書，就會及格了。"],["I wish I spoke better English.","真希望我的英文說得更好。"],["I wish I had listened to you.","真希望當初有聽你的話。"]],
 q:[["If you ___ me, I would have helped you.",["told","had told","have told"],1,"主要子句是 would have，if 子句用 had + p.p.。"],["If it hadn't rained, we ___ to the beach.",["would go","would have gone","will go"],1,"和過去事實相反，用 would have + p.p.。"],["I wish I ___ taller.",["am","were","will be"],1,"希望現在不一樣，用 were。"],["I wish I ___ that cake. Now I feel sick.",["didn't eat","hadn't eaten","don't eat"],1,"後悔過去的事，用 had + p.p.。"]]},
{id:"g_modal",level:"B2",title:"助動詞推測 must / might / can't",sum:"表達你有多確定。",
 pts:["must：幾乎確定「一定是」。","might、may、could：「可能是」，不太確定。","can't：確定「不可能」。","推測過去的事：助動詞 + have + p.p.（must have forgotten）。"],
 f:[["現在","must / might / can't + 原形"],["過去","must / might / can't + have + p.p."]],
 ex:[["He must be tired after the long trip.","長途旅行之後他一定很累。"],["She might be at home.","她可能在家。"],["That can't be true.","那不可能是真的。"],["They must have forgotten the meeting.","他們一定是忘了開會。"]],
 q:[["The lights are off. They ___ be out.",["must","can't","should"],0,"燈都關了，幾乎確定出門了。"],["He's not answering. He ___ be busy.",["might","can't","mustn't"],0,"不確定原因，用 might。"],["You ___ be hungry. You just ate!",["can't","must","might"],0,"剛吃過，不可能餓。"],["The road is wet. It ___ rained last night.",["must have","can't have","should"],0,"推測過去的事，用 must have + p.p.。"]]},
{id:"g_participle",level:"B2",title:"分詞構句與 -ing / -ed 形容詞",sum:"讓句子更簡潔，並分清楚 bored 和 boring。",
 pts:["兩個子句主詞相同時，可以省略連接詞和主詞，把動詞改成分詞。","主動意思用 V-ing（Walking…），被動意思用 p.p.（Written…）。","-ing 形容詞描述「令人…的」事物；-ed 形容詞描述人「感到…」。"],
 f:[["主動","V-ing…, 主詞 + 動詞"],["被動","p.p.…, 主詞 + 動詞"],["形容詞","事物 is interesting ／ 人 is interested"]],
 ex:[["Walking along the street, I met an old friend.","走在街上時，我遇到一位老朋友。"],["Feeling tired, she went to bed early.","她覺得累，所以早早就睡了。"],["Written in simple English, the book is easy to read.","這本書用簡單的英文寫成，很好讀。"],["I'm interested in history. It's an interesting subject.","我對歷史有興趣，它是很有趣的科目。"]],
 q:[["___ the news, she started to cry.",["Hearing","Heard","To hear"],0,"她「聽到」是主動，用 V-ing。"],["___ in 1900, the house is very old.",["Building","Built","Builds"],1,"房子是「被建造」的，用 p.p.。"],["The movie was so ___.",["bored","boring","bore"],1,"電影「令人無聊」，用 -ing。"],["I was ___ by the result.",["surprising","surprised","surprise"],1,"人「感到」驚訝，用 -ed。"]]},

{id:"g_inversion",level:"C1",title:"倒裝句",sum:"把否定或限定副詞放句首，加強語氣。",
 pts:["Never、Rarely、Seldom、Not only、Hardly、Only then 等放在句首時，主詞和助動詞要對調。","句中沒有助動詞時，要補 do / does / did。","多用在正式文章和演講。"],
 f:[["結構","否定副詞 + 助動詞 + 主詞 + 動詞"],["例","Never have I… ／ Not only did he… ／ Hardly had I… when…"]],
 ex:[["Never have I seen such a beautiful view.","我從沒看過這麼美的景色。"],["Not only did he finish early, but he also helped others.","他不但提早完成，還幫助了別人。"],["Hardly had I arrived when it started to rain.","我一到就開始下雨了。"],["Only then did I realize my mistake.","直到那時我才發現自己的錯。"]],
 q:[["Never ___ such a mess.",["I have seen","have I seen","I saw"],1,"Never 放句首，助動詞 have 移到主詞前。"],["Not only ___ late, but she also forgot her book.",["she was","was she","she is"],1,"Not only 放句首要倒裝。"],["Rarely ___ eat out.",["we do","do we","we"],1,"沒有助動詞時補 do，再倒裝。"],["Only after the meeting ___ the truth.",["I learned","did I learn","I did learn"],1,"Only after… 放句首要倒裝，補 did。"]]},
{id:"g_subj",level:"C1",title:"假設語氣進階",sum:"It's time、would rather、suggest that、as if 的特殊用法。",
 pts:["It's (high) time + 主詞 + 過去式：早就該做了。","would rather + 主詞 + 過去式：寧願別人做某事。","suggest / insist / recommend that + 主詞 + 原形（美式英文省略 should）。","as if + 過去式 / were：好像…一樣（其實不是）。"],
 f:[["It's time","It's time + 主詞 + 過去式"],["would rather","I'd rather + 主詞 + 過去式"],["建議","suggest / insist that + 主詞 + 原形"],["as if","as if + 主詞 + 過去式 / were"]],
 ex:[["It's time we went home.","我們該回家了。"],["I'd rather you didn't smoke here.","我寧願你不要在這裡抽菸。"],["The doctor suggested that he rest for a week.","醫生建議他休息一週。"],["He talks as if he knew everything.","他說話的樣子好像什麼都懂。"]],
 q:[["It's high time you ___ a job.",["find","found","will find"],1,"It's time 後面用過去式。"],["I insist that he ___ the truth.",["tells","tell","told"],1,"insist that 後面用原形。"],["I'd rather you ___ tomorrow.",["come","came","will come"],1,"would rather + 主詞 + 過去式。"],["She acts as if she ___ the boss.",["is","were","be"],1,"as if 表示與事實相反，用 were。"]]},
{id:"g_cleft",level:"C1",title:"強調句 It is… that / What…",sum:"把句子裡最想強調的部分挑出來。",
 pts:["It is / was + 強調的部分 + that（強調人時也可以用 who）。","What + 子句 + is / was…：「…的是…」。","What 開頭的主詞是一件事，動詞通常用單數。"],
 f:[["It 句型","It was + 強調部分 + that / who + 其餘"],["What 句型","What + 主詞 + 動詞 + is / was + 重點"]],
 ex:[["It was Tom who broke the window.","打破窗戶的是 Tom。"],["It is in Tainan that I grew up.","我是在台南長大的。"],["What I need is a long vacation.","我需要的是一個長假。"],["What surprised me was his attitude.","讓我驚訝的是他的態度。"]],
 q:[["It was my sister ___ called you.",["who","which","what"],0,"強調人，用 who（或 that）。"],["___ I want is some peace and quiet.",["That","What","Which"],1,"「我想要的」用 What。"],["It was in 2020 ___ we moved here.",["when","that","which"],1,"It was… that 強調句固定用 that。"],["What she said ___ true.",["were","was","are"],1,"What 子句當主詞視為單數。"]]},
{id:"g_nominal",level:"C1",title:"名詞化與正式寫作",sum:"把動詞、形容詞改成名詞，讓文章更正式。",
 pts:["正式報告、論文和商務文件常用名詞代替動詞。","常見字尾：-tion / -sion（decision）、-ment（improvement）、-ance / -ence（importance）、-al（refusal）。","名詞化後常搭配 make、there is、due to 等句型。"],
 f:[["動詞→名詞","decide→decision ・ improve→improvement ・ analyze→analysis"],["形容詞→名詞","important→importance ・ difficult→difficulty"]],
 ex:[["We made the decision to expand.","我們做出了擴張的決定。"],["There was an improvement in sales.","銷售有所改善。"],["The failure of the project was due to poor planning.","專案失敗是因為規劃不良。"],["The introduction of new rules caused confusion.","新規定的推出造成了混亂。"]],
 q:[["The ___ of the new system took six months.",["implement","implementation","implemented"],1,"the … of 中間要放名詞。"],["There has been a sharp ___ in prices.",["increase","increasing","increased"],0,"a sharp 後面接名詞 increase。"],["We need to consider the ___ of this decision.",["important","importance","importantly"],1,"the … of 中間要放名詞。"],["Her ___ to help surprised everyone.",["refuse","refusal","refused"],1,"refuse 的名詞是 refusal。"]]},
{id:"g_linkers",level:"C1",title:"高級連接詞",sum:"讓句子之間的邏輯更清楚、更正式。",
 pts:["however、nevertheless（然而）：通常放在句首，後面加逗號。","therefore（因此）、moreover（此外）。","although + 子句；despite / in spite of + 名詞或 V-ing。","whereas：對比兩件事（而…）。"],
 f:[["轉折","句子. However, 句子."],["讓步","Although + 子句 ／ Despite + 名詞 / V-ing"],["對比","子句, whereas + 子句"]],
 ex:[["The plan was risky; however, it worked.","這計畫很冒險，然而成功了。"],["Despite the rain, we went out.","儘管下雨，我們還是出門了。"],["Although it was late, he kept working.","雖然很晚了，他還是繼續工作。"],["Some people like cities, whereas others prefer the countryside.","有些人喜歡城市，而有些人喜歡鄉下。"]],
 q:[["___ being tired, she finished the report.",["Although","Despite","However"],1,"後面是 V-ing，用 Despite。"],["It was expensive. ___, we bought it.",["Nevertheless","Despite","Although"],0,"放句首加逗號表示轉折，用 Nevertheless。"],["___ he studied hard, he failed.",["Despite","Although","However"],1,"後面是完整子句，用 Although。"],["He is rich, ___ his brother is poor.",["whereas","despite","therefore"],0,"對比兩個人，用 whereas。"]]},

{id:"g_mixed",level:"C2",title:"混合條件句",sum:"過去的事影響現在，或現在的特質影響過去。",
 pts:["過去影響現在：If + had p.p., 主詞 + would + 原形 + now。","現在的特質影響過去：If + 過去式 / were, 主詞 + would have + p.p.。","判斷關鍵：看 if 子句和主要子句各自講的是「過去」還是「現在」。"],
 f:[["過去→現在","If + had p.p., would + 原形"],["現在→過去","If + 過去式, would have + p.p."]],
 ex:[["If I had taken that job, I would be rich now.","要是當初接了那份工作，我現在就有錢了。"],["If she weren't so shy, she would have spoken up.","要不是她這麼害羞，當時她就會開口了。"],["If we had booked earlier, we wouldn't be standing in line now.","要是早點訂，我們現在就不用排隊了。"],["If he were more careful, he wouldn't have lost his wallet.","要是他細心一點，就不會弄丟錢包了。"]],
 q:[["If I had studied medicine, I ___ a doctor now.",["would be","would have been","will be"],0,"過去的選擇影響現在，用 would + 原形。"],["If she ___ afraid of flying, she would have come with us.",["isn't","weren't","hadn't"],1,"怕坐飛機是她一直以來的特質（現在），用 weren't。"],["If you had listened to me, we ___ lost now.",["wouldn't be","won't be","wouldn't have"],0,"過去沒聽話，影響現在，用 wouldn't be。"],["If I ___ you, I would have said no.",["am","were","had"],1,"「如果我是你」是現在的假設，用 were。"]]},
{id:"g_ellipsis",level:"C2",title:"省略與替代",sum:"So do I、Neither can I、I hope not：道地的簡短回應。",
 pts:["So + 助動詞 + 主詞：我也是（肯定）。","Neither / Nor + 助動詞 + 主詞：我也不（否定）。","do so 代替前面提過的動作；one / ones 代替前面提過的名詞。","I think so / I hope not：用 so 和 not 代替整個子句。"],
 f:[["我也是","So + 助動詞 + 主詞"],["我也不","Neither + 助動詞 + 主詞"],["替代","do so ・ one / ones ・ I hope so / not"]],
 ex:[["I love jazz. — So do I.","我愛爵士樂。——我也是。"],["She can't swim, and neither can I.","她不會游泳，我也不會。"],["He promised to help, and he did so.","他答應會幫忙，也真的做到了。"],["Will it rain tomorrow? — I hope not.","明天會下雨嗎？——希望不會。"]],
 q:[["I've never been to Paris. — ___.",["Neither have I","So have I","Neither I have"],0,"否定的「我也沒有」，Neither + 助動詞 + 主詞。"],["She works hard, and so ___ her husband.",["is","does","do"],1,"works 是一般動詞，助動詞用 does。"],["Will it rain? — I hope ___.",["not","no","don't"],0,"I hope not 代替 I hope it won't rain。"],["These shoes are too small. Do you have bigger ___?",["one","ones","it"],1,"代替複數名詞 shoes，用 ones。"]]},
{id:"g_absolute",level:"C2",title:"完成分詞與獨立分詞構句",sum:"Having finished…、Weather permitting…、Generally speaking…",
 pts:["Having + p.p.：強調這個動作先完成，才做下一件事。","主詞不同時，分詞前保留自己的主詞：Weather permitting, …","有些固定說法沒有主詞：generally speaking、strictly speaking、all things considered。"],
 f:[["先完成","Having + p.p., 主詞 + 動詞"],["獨立分詞","名詞 + 分詞, 主詞 + 動詞"],["固定用法","Generally speaking ・ All things considered"]],
 ex:[["Having finished the report, she left early.","寫完報告後，她提早離開。"],["Weather permitting, we'll have a picnic.","天氣允許的話，我們會去野餐。"],["All things considered, it was a success.","綜合來看，這次是成功的。"],["Generally speaking, the plan is good.","一般來說，這個計畫不錯。"]],
 q:[["___ the email, he logged off.",["Having sent","Sent","Having send"],0,"先寄完信才登出，用 Having + p.p.。"],["All things ___, it was a success.",["consider","considered","considering"],1,"固定用法 all things considered。"],["Strictly ___, this is not allowed.",["speak","speaking","spoken"],1,"固定用法 strictly speaking。"],["___ in the countryside, she loves nature.",["Having grown up","Grew up","Having grow up"],0,"在鄉下長大是先發生的，用 Having + p.p.。"]]},
{id:"g_register",level:"C2",title:"正式與非正式語體",sum:"同一件事，在信件和聊天裡要用不同的說法。",

// ---------- daily tasks ----------
const newGoal=()=>S.newGoal||10;
const allWords=()=>allSets().flatMap(s=>s.words);
const dueList=()=>allWords().filter(isDue);
const newList=()=>lvSets().flatMap(s=>s.words).filter(w=>!seen(w));
function startDaily(){const ds=dayState();const rev=shuffle(dueList()).slice(0,40);
  const nw=newList().slice(0,Math.max(0,newGoal()-ds.newN));
  if(!rev.length&&!nw.length)return toast("今天的單字任務完成了！");
  run={kind:"flash",from:"daily",list:[...rev,...nw],i:0,ok:0};go({name:"flash"})}
function dailyPanel(){const ds=dayState(),due=dueList().length,goal=newGoal(),nleft=Math.max(0,goal-ds.newN),avail=newList().length,nn=Math.min(nleft,avail);
  const rows=[
    ["複習到期單字",ds.revN,ds.revN+due,due===0&&ds.revN===0?"今天沒有到期的字":`${ds.revN} / ${ds.revN+due}`],
    ["學新單字",Math.min(ds.newN,goal),goal,avail===0&&nleft>0?"這一級的新字都學過了":`${Math.min(ds.newN,goal)} / ${goal}`],
    ["上一堂文法課",Math.min(ds.gram,1),1,ds.gram?"完成":"未完成"],
    ["聽一段情境對話",Math.min(ds.talk,1),1,ds.talk?"完成":"未完成"]];
  const wordsDone=due===0&&nn===0;
  return `<section class="panel daily">
    <div class="row"><h2>今日任務</h2><label class="ngl" for="ng">每天新字
      <select id="ng">${[5,10,15,20].map(n=>`<option value="${n}" ${n===goal?"selected":""}>${n}</option>`).join("")}</select></label></div>
    <div class="tasks">${rows.map(([t,d,tot,txt])=>{const ok=tot===0||d>=tot;return `<div class="task ${ok?"ok":""}"><i aria-hidden="true">${ok?"✓":""}</i><span>${t}</span><span class="muted">${txt}</span></div>`}).join("")}</div>
    ${wordsDone?`<p class="donemsg">今天的單字任務完成了，可以去上文法或聽對話。</p>`:`<button class="btn pri" data-q="daily">開始今日單字（複習 ${Math.min(due,40)}・新字 ${nn}）</button>`}
    <div class="btns"><button class="btn ghost" data-q="grammar">文法課</button><button class="btn ghost" data-q="talk">情境對話</button></div>
    ${S.placed?"":`<button class="ptip" data-q="placement">${IC.target}<span>第一次用？先做 3 分鐘程度測驗，找出該從哪一級開始</span><b>›</b></button>`}
  </section>`}
document.addEventListener("change",e=>{
  if(e.target.id==="ng"){S.newGoal=+e.target.value;save();render()}
  if(e.target.id==="hz"){S.hideZh=!e.target.checked;save();document.querySelectorAll(".bub .zh").forEach(z=>z.hidden=S.hideZh)}});

// ---------- grammar ----------
let GQ=null;
const gNum=g=>GRAMMAR.filter(x=>x.level===g.level).indexOf(g)+1;
V.grammar=()=>{const ls=GRAMMAR.filter(g=>S.level==="全部"||g.level===S.level),done=ls.filter(g=>S.gram[g.id]).length;
  app.innerHTML=`<div class="row"><h2>文法課</h2><span class="muted" style="font-size:13px">已完成 ${done} / ${ls.length} 課</span></div>${lvBar()}
  <div class="glist">${ls.map(g=>`<button class="gcard" data-g="${g.id}"><span class="gnum ${S.gram[g.id]?"ok":""}">${S.gram[g.id]?"✓":gNum(g)}</span>
    <div style="min-width:0"><h3>${esc(g.title)}</h3><p>${esc(g.sum)}</p></div>${S.level==="全部"?`<span class="chip">${g.level}</span>`:""}</button>`).join("")}</div>`;
  app.onclick=e=>{const b=e.target.closest("[data-g]");if(b)go({name:"lesson",id:b.dataset.g})}};
V.lesson=()=>{const g=GRAMMAR.find(x=>x.id===view.id);if(!g)return go({name:"grammar"});
  if(view.quiz&&GQ&&GQ.g===g)return lessonQuiz(g);
  app.innerHTML=`<button class="back" data-back>${IC.left}文法課</button>
  <section class="panel lesson">
    <span class="chip">${g.level}・第 ${gNum(g)} 課${S.gram[g.id]?"・已完成":""}</span>
    <h2 style="font-size:22px">${esc(g.title)}</h2><p class="muted" style="margin:0">${esc(g.sum)}</p>
    <h3>重點</h3><ul>${g.pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
    <h3>公式</h3><div class="ftable">${g.f.map(([k,v])=>`<div class="frow"><span>${esc(k)}</span><code>${esc(v)}</code></div>`).join("")}</div>
    <h3>例句</h3><div class="wlist">${g.ex.map(([en,zh])=>`<div class="witem ex2"><button class="say" data-say="${esc(en)}" aria-label="發音">${IC.spk}</button><div style="min-width:0"><div class="exen">${esc(en)}</div><div class="zh">${esc(zh)}</div></div></div>`).join("")}</div>
  </section>
  <button class="btn pri" data-start>開始小測驗（${g.q.length} 題）</button>`;
  app.onclick=e=>{if(e.target.closest("[data-back]"))return go({name:"grammar"});
    const sy=e.target.closest("[data-say]");if(sy)return speak(sy.dataset.say);
    if(e.target.closest("[data-start]")){GQ={g,i:0,ok:0,ans:null,saved:false};go({name:"lesson",id:g.id,quiz:true})}}};
function fmtQ(t){return esc(t).replace(/___/g,'<span class="blank">＿＿＿</span>')}
function lessonQuiz(g){const n=g.q.length;
  if(GQ.i>=n){if(!GQ.saved){GQ.saved=true;const prev=S.gram[g.id];S.gram[g.id]={best:Math.max(GQ.ok,prev?prev.best:0),d:todayStr()};dayState().gram++;save();markToday()}
    const list=GRAMMAR.filter(x=>x.level===g.level),nx=list[list.indexOf(g)+1]||GRAMMAR[GRAMMAR.indexOf(g)+1];
    app.innerHTML=`<section class="panel done" style="padding:28px 16px"><span style="font-size:42px" aria-hidden="true">${GQ.ok===n?"🎉":GQ.ok>=n/2?"👍":"💪"}</span>
      <div class="big">${GQ.ok}/${n}</div><h2>${esc(g.title)}</h2><p class="muted" style="margin:0">${GQ.ok===n?"全對！這一課你學會了。":"錯的題目再看一次重點，會更清楚。"}</p></section>
      <div class="btns"><button class="btn ghost" data-re>再看一次重點</button>${nx?`<button class="btn pri" data-nx="${nx.id}">下一課</button>`:`<button class="btn pri" data-list>回文法課</button>`}</div>`;
    app.onclick=e=>{if(e.target.closest("[data-re]"))return go({name:"lesson",id:g.id});
      const b=e.target.closest("[data-nx]");if(b)return go({name:"lesson",id:b.dataset.nx});if(e.target.closest("[data-list]"))go({name:"grammar"})};return}
  const [q,opts,a,why]=g.q[GQ.i];
  app.innerHTML=`<div class="prog"><button class="back" data-quit aria-label="結束">✕</button><div class="bar"><div style="width:${GQ.i/n*100}%;background:var(--accent)"></div></div><span>${GQ.i}/${n}</span></div>
  <section class="panel" style="padding:24px 16px;display:flex;flex-direction:column;gap:6px"><span class="muted" style="font-size:13px">選出正確的答案</span><div class="qtext">${fmtQ(q)}</div>${qtools(q,opts)}</section>
  <div class="opts">${opts.map((o,i)=>`<button class="opt" data-o="${i}">${esc(o)}</button>`).join("")}</div>
  <div class="why" id="why" hidden></div>
  <button class="btn pri" id="gnext" hidden>${GQ.i+1<n?"下一題":"看結果"}</button>`;
  app.onclick=e=>{if(e.target.closest("[data-quit]"))return go({name:"lesson",id:g.id});
    if(e.target.closest("#gnext")){GQ.i++;return render()}
    const o=e.target.closest("[data-o]");if(!o||GQ.ans!==null&&GQ.ans===GQ.i)return;GQ.ans=GQ.i;
    const ok=+o.dataset.o===a;if(ok)GQ.ok++;
    app.querySelectorAll("[data-o]").forEach(b=>{if(+b.dataset.o===a)b.classList.add("right");else if(b===o)b.classList.add("wrong")});
    const w=document.getElementById("why");w.hidden=false;w.className="why "+(ok?"good":"bad");w.innerHTML=`<b>${ok?"答對了！":"正確答案："+esc(opts[a])}</b>${esc(why)}`;
    document.getElementById("gnext").hidden=false;
    if(q.includes("___"))speak(q.replace("___",opts[a]).split("→").pop().trim())};
  if(S.autoRead!==false)setTimeout(()=>readQ(q),250)}

// ---------- placement test ----------
let PT=null;
function startPlacement(){const qs=[];
  for(const L of LEVELS){
    const gq=shuffle(GRAMMAR.filter(g=>g.level===L).flatMap(g=>g.q.map(q=>({q:q[0],opts:q[1],a:q[2],kind:"文法"})))).slice(0,2);
    const ws=shuffle(allSets().filter(s=>s.level===L).flatMap(s=>s.words).filter(w=>!/[.?!,]/.test(w.en)));
    const vq=ws.slice(0,2).map(w=>{const others=shuffle(ws.filter(x=>x.zh!==w.zh&&x.en!==w.en)).slice(0,3),opts=shuffle([w,...others]);
      return{q:w.en,opts:opts.map(o=>o.zh),a:opts.indexOf(w),kind:"單字"}});
    [...vq,...gq].forEach(x=>qs.push({...x,L}))}
  PT={qs,i:0,score:{}};go({name:"placement"})}
V.placement=()=>{
  if(!PT){app.innerHTML=`<button class="back" data-home>${IC.left}首頁</button>
    <section class="panel" style="display:flex;flex-direction:column;gap:12px">
      <h2 style="font-size:22px">程度測驗</h2>
      <p style="margin:0">共 24 題，從 A1 一路到 C2，每一級 2 題單字、2 題文法，大約 3 分鐘。</p>
      <p class="muted" style="margin:0">不會的題目請選「我不確定」，不要用猜的，結果會比較準。測驗完會建議你從哪一級開始。</p>
      ${S.placed?`<p class="muted" style="margin:0">上次結果：建議從 <b>${S.placed.level}</b> 開始（${S.placed.d}）</p>`:""}
      <button class="btn pri" data-pstart>開始測驗</button></section>`;
    app.onclick=e=>{if(e.target.closest("[data-home]"))return go({name:"home"});if(e.target.closest("[data-pstart]"))startPlacement()};return}
  const n=PT.qs.length;
  if(PT.i>=n){let rec="C2";for(const L of LEVELS){if((PT.score[L]||0)<3){rec=L;break}}
    app.innerHTML=`<section class="panel" style="display:flex;flex-direction:column;gap:14px">
      <span class="muted">測驗結果</span><h2 style="font-size:24px">建議從 ${rec} 開始</h2>
      <p style="margin:0">${rec}・${LVINFO[rec][0]}・${LVINFO[rec][1]}：${LVINFO[rec][2]}</p>
      <div class="pres">${LEVELS.map(L=>{const s=PT.score[L]||0;return `<div class="prow ${L===rec?"rec":""}"><b>${L}</b><div class="bar"><div style="width:${s/4*100}%;${s>=3?"":"background:var(--sun)"}"></div></div><span>${s}/4</span></div>`}).join("")}</div>
      <p class="muted" style="margin:0;font-size:13px">每一級答對 3 題以上算過關，建議從第一個沒過關的級別開始。</p>
      <button class="btn pri" data-use="${rec}">從 ${rec} 開始學</button><button class="btn ghost" data-pstart>重新測驗</button></section>`;
    app.onclick=e=>{const u=e.target.closest("[data-use]");if(u){S.level=u.dataset.use;S.placed={level:u.dataset.use,d:todayStr()};save();PT=null;toast("已設定為 "+u.dataset.use);return go({name:"home"})}
      if(e.target.closest("[data-pstart]"))startPlacement()};return}
  const x=PT.qs[PT.i];
  app.innerHTML=`<div class="prog"><button class="back" data-quit aria-label="結束">✕</button><div class="bar"><div style="width:${PT.i/n*100}%;background:var(--accent)"></div></div><span>${PT.i+1}/${n}</span></div>
  <section class="panel" style="padding:24px 16px;display:flex;flex-direction:column;gap:6px"><span class="muted" style="font-size:13px">${x.kind==="單字"?"這個字是什麼意思？":"選出正確的答案"}</span>
    <div class="qtext" ${x.kind==="單字"?'style="font-family:var(--display);font-size:30px"':""}>${fmtQ(x.q)}</div>${qtools(x.q,x.opts)}</section>
  <div class="opts">${x.opts.map((o,i)=>`<button class="opt" data-o="${i}">${esc(o)}</button>`).join("")}<button class="opt unsure" data-o="-1">我不確定</button></div>`;
  app.onclick=e=>{if(e.target.closest("[data-quit]")){PT=null;return go({name:"home"})}
    const o=e.target.closest("[data-o]");if(!o)return;if(+o.dataset.o===x.a)PT.score[x.L]=(PT.score[x.L]||0)+1;PT.i++;render()};
  if(S.autoRead!==false)setTimeout(()=>readQ(x.q),250)};

// ---------- dialogues ----------
let P=null;
if(!S.talk)S.talk={};
function stopP(){if(!P)return;P.tok++;P=null;try{speechSynthesis.cancel()}catch(e){}hl(-1)}
function enVoices(){const a=enVoice(),g=goodVoices();return [a,g.find(v=>a&&v.name!==a.name)||a]}
function hl(i){document.querySelectorAll(".bub").forEach((b,j)=>b.classList.toggle("now",j===i));const el=document.querySelector(".bub.now");if(el)el.scrollIntoView({block:"nearest",behavior:"smooth"})}
function setHint(t){const h=document.getElementById("phint");if(h)h.textContent=t}
async function playDialog(d,mode){stopP();P={tok:1,mode};const tok=P.tok,ok=()=>P&&P.tok===tok,vs=enVoices(),va=vs[0],vb=vs[1]||vs[0];
  setHint(mode==="shadow"?"跟讀模式：聽完一句，換你大聲念出來":"播放中…");
  for(let i=0;i<d.lines.length;i++){if(!ok())return;hl(i);const [sp,en]=d.lines[i];
    await say(en,"en-US",S.slowTalk?.75:.95,sp==="A"?va:vb);if(!ok())return;
    if(mode==="shadow"){setHint("換你念 🗣");await wait(1200+en.length*85);if(!ok())return;setHint("")}else await wait(450)}
  if(!ok())return;P=null;hl(-1);setHint("");dayState().talk++;S.talk[d.id]=todayStr();save();markToday();toast(mode==="shadow"?"跟讀完成！":"聽完了！")}
V.talk=()=>{const ls=DIALOGS.filter(d=>S.level==="全部"||d.level===S.level);
  app.innerHTML=`<div class="row"><h2>情境對話</h2><span class="muted" style="font-size:13px">可以整段聽，也可以跟讀</span></div>${lvBar()}
  <div class="glist">${ls.map(d=>`<button class="gcard" data-d="${d.id}"><span class="gnum ${S.talk[d.id]?"ok":""}">${S.talk[d.id]?"✓":IC.chat}</span>
    <div style="min-width:0"><h3>${esc(d.title)}</h3><p>${esc(d.scene)}・${d.lines.length} 句</p></div><span class="chip">${d.level}</span></button>`).join("")}</div>`;
  app.onclick=e=>{const b=e.target.closest("[data-d]");if(b)go({name:"dialog",id:b.dataset.d})}};
V.dialog=()=>{const d=DIALOGS.find(x=>x.id===view.id);if(!d)return go({name:"talk"});
  app.innerHTML=`<button class="back" data-back>${IC.left}情境對話</button>
  <section class="panel" style="display:flex;flex-direction:column;gap:10px">
    <div class="row"><h2 style="font-size:21px">${esc(d.title)}</h2><span class="chip">${d.level}</span></div>
    <span class="muted" style="font-size:13px">${esc(d.scene)}。點任何一句可以單獨聽。</span>
    <div class="pbtns"><button class="btn pri" data-p="all">整段播放</button><button class="btn ok" data-p="shadow">跟讀模式</button><button class="btn ghost" data-p="stop">停止</button></div>
    <div class="row" style="font-size:14px"><label class="inl" for="hz"><input type="checkbox" id="hz" ${S.hideZh?"":"checked"}>顯示中文</label>
      <label class="inl" for="sl"><input type="checkbox" id="sl" ${S.slowTalk?"checked":""}>慢速</label></div>
    <div class="phint" id="phint" aria-live="polite"></div>
  </section>
  <div class="chat">${d.lines.map((l,i)=>`<button class="bub ${l[0]==="A"?"l":"r"}" data-line="${i}"><span class="who">${l[0]}</span><span class="en">${esc(l[1])}</span><span class="zh" ${S.hideZh?"hidden":""}>${esc(l[2])}</span></button>`).join("")}</div>`;
  document.getElementById("sl").onchange=e=>{S.slowTalk=e.target.checked;save()};
  app.onclick=e=>{if(e.target.closest("[data-back]"))return go({name:"talk"});
    const p=e.target.closest("[data-p]");if(p){const m=p.dataset.p;if(m==="stop"){stopP();setHint("");return}return playDialog(d,m)}
    const ln=e.target.closest("[data-line]");if(ln){stopP();try{speechSynthesis.cancel()}catch(e){}const i=+ln.dataset.line,vs=enVoices();hl(i);
      say(d.lines[i][1],"en-US",S.slowTalk?.75:.95,d.lines[i][0]==="A"?vs[0]:(vs[1]||vs[0])).then(()=>{if(!P)hl(-1)})}}};

// ---------- voice selection ----------
const BADV=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Kathy|Ralph|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
const GOODV=/Samantha|Ava|Allison|Susan|Zoe|Nicky|Evan|Tom|Aaron|Alex|Joelle|Noelle|Nathan|Google US English|Google UK English|Aria|Jenny|Guy|Libby|Sonia|Ryan/i;
function vScore(v){return (/Premium|Enhanced|Natural|Neural|加強|高品質/i.test(v.name)?4:0)+(GOODV.test(v.name)?2:0)+(/en[-_]US/i.test(v.lang)?1:0)}
function goodVoices(){try{return speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)&&!BADV.test(v.name)).sort((a,b)=>vScore(b)-vScore(a))}catch(e){return[]}}
function enVoice(){const g=goodVoices();return (S.voice&&g.find(v=>v.name===S.voice))||g[0]||null}
function zhVoice(){try{const v=speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang)&&!BADV.test(v.name));return v.find(x=>/TW/i.test(x.lang)&&/Mei|美佳/i.test(x.name))||v.find(x=>/TW/i.test(x.lang))||v.find(x=>/HK/i.test(x.lang))||v[0]||null}catch(e){return null}}
try{speechSynthesis.onvoiceschanged=()=>{if(view&&view.name==="drive"&&!D)render()}}catch(e){}
function voicePicker(){const g=goodVoices(),cur=enVoice();
  return `<section class="panel" style="display:flex;flex-direction:column;gap:8px"><div class="field"><label for="vsel">朗讀聲音（英文）</label>
    <select id="vsel">${g.length?g.map(v=>`<option value="${esc(v.name)}" ${cur&&v.name===cur.name?"selected":""}>${esc(v.name)}（${esc(v.lang)}）</option>`).join(""):"<option>使用系統預設聲音</option>"}</select></div>
    <button class="btn ghost" data-vtest>試聽</button>
    <p class="muted" style="margin:0;font-size:13px">聲音還是很機械的話：iPhone 可到「設定 → 輔助使用 → 朗讀內容 → 聲音 → 英文」下載「加強版」的 Ava 或 Samantha，下載後回來這裡選它。</p></section>`}
document.addEventListener("change",e=>{if(e.target.id==="vsel"){S.voice=e.target.value;save();speak("Hello! This is my voice.")}});
document.addEventListener("click",e=>{if(e.target.closest("[data-vtest]"))speak("Hello! Nice to meet you. How are you today?")});

// ---------- read-aloud for quizzes ----------
let RL=0;
const hasZh=t=>/[\u4e00-\u9fff]/.test(t);
function readQ(t){RL++;t=String(t).replace(/___/g," … ").replace(/→/g,". ");try{speechSynthesis.cancel()}catch(e){}
  if(hasZh(t))say(t,"zh-TW",1);else say(t,"en-US",.9)}
async function readList(arr){try{speechSynthesis.cancel()}catch(e){}const tok=++RL;
  for(const o of arr){if(tok!==RL)return;await say(o,hasZh(o)?"zh-TW":"en-US",hasZh(o)?1:.9);if(tok!==RL)return;await wait(350)}}
function qtools(q,opts){return `<div class="qtools"><button class="chipbtn" data-rq="${esc(q)}">${IC.spk}聽題目</button><button class="chipbtn" data-ro="${esc(JSON.stringify(opts))}">${IC.spk}聽選項</button>
  <label class="inl sm" for="ar"><input type="checkbox" id="ar" ${S.autoRead!==false?"checked":""}>自動朗讀題目</label></div>`}
document.addEventListener("click",e=>{const q=e.target.closest("[data-rq]");if(q)return readQ(q.dataset.rq);
  const o=e.target.closest("[data-ro]");if(o){try{readList(JSON.parse(o.dataset.ro))}catch(err){}}});
document.addEventListener("change",e=>{if(e.target.id==="ar"){S.autoRead=e.target.checked;save()}});

render();
</script>

</body></html>
