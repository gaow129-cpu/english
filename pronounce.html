<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>發音教練</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: single centered column — level chips, practice card, score panel */
:root{
  --bg:#eef3f6; --surface:#fff; --ink:#1d2b36; --muted:#617383; --line:#d8e2e9;
  --accent:#2f6fd8; --accent-soft:#e3edfc; --sun:#f2a33a; --sun-soft:#fdf0dc;
  --good:#2e9a62; --good-soft:#e1f4ea; --bad:#d6504a; --bad-soft:#fbe5e3;
  --display:"Fredoka","Noto Sans TC",system-ui,sans-serif; --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --bg:#111a22; --surface:#1a2631; --ink:#e7eef4; --muted:#93a5b4; --line:#2a3946;
  --accent:#6aa2ff; --accent-soft:#1f3150; --sun:#f5b65d; --sun-soft:#3a2d1a;
  --good:#5cc78f; --good-soft:#18352a; --bad:#ef7a73; --bad-soft:#3d2120; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-family:var(--display);font-size:24px}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 16px}
.card{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.target{font-family:var(--display);font-weight:700;font-size:clamp(26px,8vw,40px);line-height:1.25;word-break:break-word}
.target .w{padding:0 2px;border-radius:6px}
.target .w.hit{color:var(--good)}.target .w.miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:6px}
.zh{color:var(--muted)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:12px 18px;border-radius:14px;font-weight:900;border-bottom:4px solid rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px)}
.ghost{background:var(--surface);border:1px solid var(--line);border-bottom-width:4px}
.mic{width:96px;height:96px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;border-bottom:5px solid rgba(0,0,0,.2)}
.mic svg{width:42px;height:42px}
.mic.rec{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 60%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
.listen{background:var(--accent-soft);color:var(--accent)}
.status{min-height:1.5em;font-weight:700;color:var(--muted)}
.score{display:none;flex-direction:column;align-items:center;gap:6px}
.score.show{display:flex}
.num{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.grade{font-weight:900;font-size:18px}
.heard{font-size:14px;color:var(--muted)}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border-radius:12px;padding:8px}
.stats b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:var(--sun-soft);border-radius:12px;padding:12px 14px}
.warn{background:var(--bad-soft);color:var(--ink);border-radius:12px;padding:14px;font-weight:700}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}}
</style>
</head>
<body>
<main>
  <a href="index.html" style="color:var(--accent);font-weight:700;text-decoration:none">‹ 回字卡星球</a>
  <header><h1>發音教練</h1><span class="muted" style="font-size:13px">念念看，看系統聽不聽得懂</span></header>
  <div id="warn" class="warn" hidden></div>
  <div class="chips" id="lv"></div>
  <div class="chips" id="md"></div>
  <section class="panel card" id="card">
    <span class="muted" id="pos" style="font-size:13px"></span>
    <div class="target" id="target"></div>
    <div class="zh" id="zh"></div>
    <div class="row">
      <button class="btn listen" id="play">🔊 聽示範</button>
      <button class="btn ghost" id="slow">🐢 慢速</button>
    </div>
    <button class="mic" id="mic" aria-label="按下開始念"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <div class="status" id="status">按紅色按鈕，然後大聲念出上面的英文</div>
    <div class="score" id="score">
      <div class="num" id="num">0</div>
      <div class="grade" id="grade"></div>
      <div class="heard" id="heard"></div>
    </div>
  </section>
  <div class="nav">
    <button class="btn ghost" id="prev">‹ 上一個</button>
    <button class="btn ghost" id="rand">隨機</button>
    <button class="btn ghost" id="next">下一個 ›</button>
  </div>
  <section class="panel">
    <div class="stats">
      <div><b id="sN">0</b><span>今天練習</span></div>
      <div><b id="sAvg">–</b><span>平均分數</span></div>
      <div><b id="s90">0</b><span>90 分以上</span></div>
    </div>
  </section>
  <p class="note">評分方式：用瀏覽器內建的英文語音辨識聽你念的內容，比對和原文有多接近。分數高代表外國人大概聽得懂你在說什麼；它沒辦法逐個音標檢查，像 th、r/l 這類細節請搭配「聽示範」多比較。<br>需要使用麥克風，第一次會詢問權限，請按「允許」。</p>
</main>

。"},{"en":"What surprised me was his attitude.","zh":"讓我驚訝的是他的態度。"},{"en":"We made the decision to expand.","zh":"我們做出了擴張的決定。"},{"en":"There was an improvement in sales.","zh":"銷售有所改善。"},{"en":"The failure of the project was due to poor planning.","zh":"專案失敗是因為規劃不良。"},{"en":"The introduction of new rules caused confusion.","zh":"新規定的推出造成了混亂。"},{"en":"The plan was risky; however, it worked.","zh":"這計畫很冒險，然而成功了。"},{"en":"Despite the rain, we went out.","zh":"儘管下雨，我們還是出門了。"},{"en":"Although it was late, he kept working.","zh":"雖然很晚了，他還是繼續工作。"},{"en":"Some people like cities, whereas others prefer the countryside.","zh":"有些人喜歡城市，而有些人喜歡鄉下。"}]},"C2":{"word":[{"en":"ubiquitous","zh":"無所不在的"},{"en":"ephemeral","zh":"短暫的"},{"en":"quintessential","zh":"典型的；精髓的"},{"en":"pervasive","zh":"遍布的；滲透的"},{"en":"esoteric","zh":"深奧難懂的"},{"en":"idiosyncratic","zh":"獨特的；怪癖的"},{"en":"magnanimous","zh":"寬宏大量的"},{"en":"candid","zh":"坦率的"},{"en":"eloquent","zh":"有口才的"},{"en":"intricate","zh":"錯綜複雜的"},{"en":"paradigm","zh":"典範；範式"},{"en":"conundrum","zh":"難題"},{"en":"exacerbate","zh":"使惡化"},{"en":"ameliorate","zh":"改善"},{"en":"obfuscate","zh":"使模糊難懂"},{"en":"juxtapose","zh":"並列對照"},{"en":"circumvent","zh":"規避"},{"en":"corroborate","zh":"證實"},{"en":"delineate","zh":"清楚描述；劃定"},{"en":"galvanize","zh":"激勵；促使行動"},{"en":"relinquish","zh":"放棄；交出"},{"en":"substantiate","zh":"證實；提出證據"},{"en":"undermine","zh":"削弱；暗中破壞"},{"en":"reconcile","zh":"調和；和解"},{"en":"the elephant in the room","zh":"大家避而不談的問題"},{"en":"a blessing in disguise","zh":"因禍得福"},{"en":"bite the bullet","zh":"咬牙面對"},{"en":"beat around the bush","zh":"拐彎抹角"},{"en":"cut corners","zh":"偷工減料"},{"en":"the ball is in your court","zh":"該你做決定了"},{"en":"read between the lines","zh":"讀出言外之意"},{"en":"go the extra mile","zh":"多付出一點"},{"en":"a double-edged sword","zh":"雙面刃"},{"en":"jump on the bandwagon","zh":"跟風"},{"en":"back to square one","zh":"回到原點"},{"en":"once in a blue moon","zh":"極少；難得一次"}],"sent":[{"en":"Smartphones are now ubiquitous.","zh":"例句：ubiquitous（無所不在的）"},{"en":"Fame on social media is ephemeral.","zh":"例句：ephemeral（短暫的）"},{"en":"It's the quintessential Taiwanese breakfast.","zh":"例句：quintessential（典型的；精髓的）"},{"en":"The smell was pervasive.","zh":"例句：pervasive（遍布的；滲透的）"},{"en":"The lecture was too esoteric for me.","zh":"例句：esoteric（深奧難懂的）"},{"en":"He has an idiosyncratic style.","zh":"例句：idiosyncratic（獨特的；怪癖的）"},{"en":"She was magnanimous in victory.","zh":"例句：magnanimous（寬宏大量的）"},{"en":"Thank you for your candid feedback.","zh":"例句：candid（坦率的）"},{"en":"He gave an eloquent speech.","zh":"例句：eloquent（有口才的）"},{"en":"The pattern is very intricate.","zh":"例句：intricate（錯綜複雜的）"},{"en":"This is a paradigm shift in education.","zh":"例句：paradigm（典範；範式）"},{"en":"It's a real conundrum.","zh":"例句：conundrum（難題）"},{"en":"Stress can exacerbate the problem.","zh":"例句：exacerbate（使惡化）"},{"en":"New laws helped ameliorate poverty.","zh":"例句：ameliorate（改善）"},{"en":"Don't obfuscate the facts.","zh":"例句：obfuscate（使模糊難懂）"},{"en":"The artist juxtaposes old and new.","zh":"例句：juxtapose（並列對照）"},{"en":"They tried to circumvent the rules.","zh":"例句：circumvent（規避）"},{"en":"Witnesses corroborated his story.","zh":"例句：corroborate（證實）"},{"en":"The contract delineates each role.","zh":"例句：delineate（清楚描述；劃定）"},{"en":"The speech galvanized the team.","zh":"例句：galvanize（激勵；促使行動）"},{"en":"He relinquished control of the company.","zh":"例句：relinquish（放棄；交出）"},{"en":"Can you substantiate that claim?","zh":"例句：substantiate（證實；提出證據）"},{"en":"Rumors can undermine trust.","zh":"例句：undermine（削弱；暗中破壞）"},{"en":"It's hard to reconcile work and family.","zh":"例句：reconcile（調和；和解）"},{"en":"Let's talk about the elephant in the room.","zh":"例句：the elephant in the room（大家避而不談的問題）"},{"en":"Losing that job was a blessing in disguise.","zh":"例句：a blessing in disguise（因禍得福）"},{"en":"I bit the bullet and saw the dentist.","zh":"例句：bite the bullet（咬牙面對）"},{"en":"Stop beating around the bush.","zh":"例句：beat around the bush（拐彎抹角）"},{"en":"Don't cut corners on safety.","zh":"例句：cut corners（偷工減料）"},{"en":"I've made my offer. The ball is in your court.","zh":"例句：the ball is in your court（該你做決定了）"},{"en":"You have to read between the lines.","zh":"例句：read between the lines（讀出言外之意）"},{"en":"She always goes the extra mile.","zh":"例句：go the extra mile（多付出一點）"},{"en":"Social media is a double-edged sword.","zh":"例句：a double-edged sword（雙面刃）"},{"en":"Everyone jumped on the bandwagon.","zh":"例句：jump on the bandwagon（跟風）"},{"en":"The plan failed. We're back to square one.","zh":"例句：back to square one（回到原點）"},{"en":"I eat fast food once in a blue moon.","zh":"例句：once in a blue moon（極少；難得一次）"},{"en":"Remote work is here to stay, whether managers like it or not.","zh":"不管主管喜不喜歡，遠距工作都會持續下去。"},{"en":"I'm not entirely convinced. Collaboration inevitably suffers without face-to-face contact.","zh":"我不完全認同。少了面對面接觸，合作難免會受影響。"},{"en":"That's debatable. Many teams are more productive at home.","zh":"這有待商榷，很多團隊在家反而更有效率。"},{"en":"Productivity, perhaps. But what about mentoring junior staff?","zh":"效率也許是，但新進同仁的指導怎麼辦？"},{"en":"Fair point. A hybrid model might strike the right balance.","zh":"說得有道理。混合模式也許能取得平衡。"},{"en":"Now that's something we can agree on.","zh":"這點我們倒是有共識。"},{"en":"You look exhausted. Burning the midnight oil again?","zh":"你看起來累壞了，又熬夜了？"},{"en":"Afraid so. The deadline's tomorrow, and we're back to square one.","zh":"恐怕是。明天就截止，結果我們又回到原點了。"},{"en":"That's rough. Still, starting over might be a blessing in disguise.","zh":"真慘。不過重新來過也許是因禍得福。"},{"en":"Maybe. Honestly, the elephant in the room is our manager.","zh":"也許吧。老實說，大家避而不談的問題其實是我們主管。"},{"en":"Then you'll have to bite the bullet and talk to him.","zh":"那你只好硬著頭皮去跟他談了。"},{"en":"I know. The ball's in my court now.","zh":"我知道，現在輪到我出招了。"},{"en":"If I had taken that job, I would be rich now.","zh":"要是當初接了那份工作，我現在就有錢了。"},{"en":"If she weren't so shy, she would have spoken up.","zh":"要不是她這麼害羞，當時她就會開口了。"},{"en":"If we had booked earlier, we wouldn't be standing in line now.","zh":"要是早點訂，我們現在就不用排隊了。"},{"en":"If he were more careful, he wouldn't have lost his wallet.","zh":"要是他細心一點，就不會弄丟錢包了。"},{"en":"I love jazz. — So do I.","zh":"我愛爵士樂。——我也是。"},{"en":"She can't swim, and neither can I.","zh":"她不會游泳，我也不會。"},{"en":"He promised to help, and he did so.","zh":"他答應會幫忙，也真的做到了。"},{"en":"Will it rain tomorrow? — I hope not.","zh":"明天會下雨嗎？——希望不會。"},{"en":"Having finished the report, she left early.","zh":"寫完報告後，她提早離開。"},{"en":"Weather permitting, we'll have a picnic.","zh":"天氣允許的話，我們會去野餐。"},{"en":"All things considered, it was a success.","zh":"綜合來看，這次是成功的。"},{"en":"Generally speaking, the plan is good.","zh":"一般來說，這個計畫不錯。"},{"en":"The results suggest that the method works.","zh":"結果顯示這個方法可能有效。"},{"en":"This may be due to the weather.","zh":"這可能是天氣造成的。"},{"en":"It appears that the market is slowing.","zh":"市場似乎正在放緩。"},{"en":"To some extent, this is true.","zh":"某種程度上，這是對的。"}]}};
const LEVELS=["A1","A2","B1","B2","C1","C2"];
const KEY="pron-coach-v1";
let S={lv:"A1",md:"word",i:0,best:{},log:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
const $=id=>document.getElementById(id);
const list=()=>DATA[S.lv][S.md];
function cur(){const l=list();if(S.i>=l.length)S.i=0;return l[S.i]}
const norm=t=>t.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim();
const words=t=>norm(t).split(" ").filter(Boolean);
function lcs(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);
  const hit=new Array(m).fill(false);let i=m,j=n;while(i&&j){if(a[i-1]===b[j-1]){hit[i-1]=true;i--;j--}else if(d[i-1][j]>=d[i][j-1])i--;else j--}
  return{len:d[m][n],hit}}
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function scoreOf(target,heard){const tw=words(target),hw=words(heard);if(!hw.length)return{score:0,hit:tw.map(()=>false)};
  const L=lcs(tw,hw),wordScore=L.len/Math.max(tw.length,hw.length);
  const a=tw.join(" "),b=hw.join(" "),charSim=1-lev(a,b)/Math.max(a.length,b.length);
  return{score:Math.round((0.55*wordScore+0.45*Math.max(0,charSim))*100),hit:L.hit}}
const BADV=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Kathy|Ralph|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
const GOODV=/Samantha|Ava|Allison|Susan|Zoe|Nicky|Evan|Tom|Aaron|Alex|Google US English|Aria|Jenny|Guy/i;
function enVoice(){try{return speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)&&!BADV.test(v.name)).sort((a,b)=>((/Premium|Enhanced|Natural/i.test(b.name)?4:0)+(GOODV.test(b.name)?2:0)+(/US/i.test(b.lang)?1:0))-((/Premium|Enhanced|Natural/i.test(a.name)?4:0)+(GOODV.test(a.name)?2:0)+(/US/i.test(a.lang)?1:0)))[0]||null}catch(e){return null}}
function speak(t,rate){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=rate||.9;const vv=enVoice();if(vv)u.voice=vv;speechSynthesis.speak(u)}catch(e){}}
function renderTarget(hit){const it=cur(),toks=it.en.split(/(\s+)/);let k=0;
  $("target").innerHTML=toks.map(t=>{if(/^\s+$/.test(t))return t;const has=norm(t).length>0;const cls=hit&&has?(hit[k++]?"hit":"miss"):"";return `<span class="w ${cls}">${t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}</span>`}).join("")}
function render(){
  $("lv").innerHTML=LEVELS.map(l=>`<button class="chip ${S.lv===l?"on":""}" data-lv="${l}">${l}</button>`).join("");
  $("md").innerHTML=[["word","單字"],["sent","句子"]].map(([k,t])=>`<button class="chip ${S.md===k?"on":""}" data-md="${k}">${t}（${DATA[S.lv][k].length}）</button>`).join("");
  const it=cur();renderTarget(null);$("zh").textContent=it.zh;$("pos").textContent=`${S.lv}・${S.i+1} / ${list().length}`+(S.best[it.en]!=null?`・最佳 ${S.best[it.en]} 分`:"");
  $("score").classList.remove("show");$("status").textContent="按紅色按鈕，然後大聲念出上面的英文";stats()}
function stats(){const l=S.log[today()]||[];$("sN").textContent=l.length;$("sAvg").textContent=l.length?Math.round(l.reduce((a,b)=>a+b,0)/l.length):"–";$("s90").textContent=l.filter(x=>x>=90).length}
function show(res,heard){const n=res.score;$("num").textContent=n;
  const [g,c]=n>=90?["很標準！","var(--good)"]:n>=75?["不錯，大致聽得懂","var(--good)"]:n>=50?["有幾個字要加強","var(--sun)"]:["再試一次，先聽示範","var(--bad)"];
  $("num").style.color=c;$("grade").textContent=g;$("grade").style.color=c;$("heard").textContent="系統聽到："+(heard||"（沒有聽到聲音）");
  $("score").classList.add("show");renderTarget(res.hit);
  const it=cur();S.best[it.en]=Math.max(S.best[it.en]||0,n);(S.log[today()]=S.log[today()]||[]).push(n);save();stats();
  $("pos").textContent=`${S.lv}・${S.i+1} / ${list().length}・最佳 ${S.best[it.en]} 分`}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,busy=false;
if(!SR){$("warn").hidden=false;$("warn").innerHTML="這個瀏覽器不支援語音辨識，沒辦法評分。<br>請用電腦或 Android 的 Chrome、或 iPhone 的 Safari 開啟這個檔案。";$("mic").disabled=true;$("mic").style.opacity=.4}
function listen(){if(!SR||busy)return;busy=true;speechSynthesis.cancel();
  rec=new SR();rec.lang="en-US";rec.interimResults=true;rec.maxAlternatives=5;rec.continuous=false;
  let finalAlts=[],interim="";$("mic").classList.add("rec");$("status").textContent="請念…（念完會自動停止）";
  rec.onresult=e=>{const r=e.results[e.results.length-1];interim=r[0].transcript;$("status").textContent="聽到："+interim;
    if(r.isFinal){finalAlts=[];for(let k=0;k<r.length;k++)finalAlts.push(r[k].transcript)}};
  rec.onerror=e=>{busy=false;$("mic").classList.remove("rec");
    $("status").textContent=e.error==="not-allowed"||e.error==="service-not-allowed"?"沒有麥克風權限，請在瀏覽器設定中允許麥克風。":e.error==="no-speech"?"沒有聽到聲音，請靠近麥克風再試一次。":"辨識失敗（"+e.error+"），請再試一次。"};
  rec.onend=()=>{if(!busy)return;busy=false;$("mic").classList.remove("rec");const alts=finalAlts.length?finalAlts:(interim?[interim]:[]);
    if(!alts.length){$("status").textContent="沒有聽到聲音，請再試一次。";return}
    const it=cur();let best={score:-1},heard="";for(const a of alts){const r=scoreOf(it.en,a);if(r.score>best.score){best=r;heard=a}}
    $("status").textContent="";show(best,heard)};
  try{rec.start()}catch(e){busy=false;$("mic").classList.remove("rec")}}
document.addEventListener("click",e=>{const l=e.target.closest("[data-lv]");if(l){S.lv=l.dataset.lv;S.i=0;save();return render()}
  const m=e.target.closest("[data-md]");if(m){S.md=m.dataset.md;S.i=0;save();return render()}});
$("play").onclick=()=>speak(cur().en,.9);$("slow").onclick=()=>speak(cur().en,.6);
$("mic").onclick=()=>{if(busy){try{rec.stop()}catch(e){}return}listen()};
$("next").onclick=()=>{S.i=(S.i+1)%list().length;save();render()};
$("prev").onclick=()=>{S.i=(S.i-1+list().length)%list().length;save();render()};
$("rand").onclick=()=>{S.i=Math.floor(Math.random()*list().length);save();render()};
if(!DATA[S.lv])S.lv="A1";if(!["word","sent"].includes(S.md))S.md="word";
render();
</script>
